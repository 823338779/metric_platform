openapi: 3.1.0
info:
  title: 指标平台固定构建 BFF
  version: 4.0.0
  description: 平台直接读取 dbt-service 的部署历史及固定 buildId 目录和查询，不依赖 Agent。平台登录凭据无效返回 401；dbt-service 返回的 401/403 转换为 502，错误码为 SERVICE_AUTHENTICATION_FAILED、retryable 为 false，不代表用户登录过期。
x-protocol-version: execution-snapshot
x-supported-protocols:
  - execution-snapshot
paths:
  /api/dbt/environments/{environmentId}/ontology:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: readEnvironmentOntology
      parameters:
      - {name: refresh, in: query, required: false, schema: {type: boolean, default: false}, description: 主动复核当前部署的字段类型}
      summary: 读取指定环境的本体及绑定状态
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 读取指定环境的本体及绑定状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyTopology'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/datasets:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: ontologyDatasets
      summary: 列出当前部署可绑定的数据集
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 列出当前部署可绑定的数据集
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyDatasets'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/datasets/{assetId}/columns:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: ontologyColumns
      summary: 读取当前构建内数据集的声明列
      security: [{bearerAuth: []}]
      parameters:
      - {name: buildId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 读取当前构建内数据集的声明列
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyColumns'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/objects:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: createOntologyObject
      summary: 创建环境内对象
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyObjectWrite'}
      responses:
        '201':
          description: 创建环境内对象
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/objects/{id}:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateOntologyObject
      summary: 编辑指定对象
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyObjectWrite'}
      responses:
        '200':
          description: 编辑指定对象
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
    delete:
      operationId: deleteOntologyObject
      summary: 删除指定对象
      security: [{bearerAuth: []}]
      parameters:
      - {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: 删除指定对象
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/relations:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: createOntologyRelation
      summary: 创建环境内关系
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyRelationWrite'}
      responses:
        '201':
          description: 创建环境内关系
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/dbt/environments/{environmentId}/ontology/relations/{id}:
    parameters:
    - {name: environmentId, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateOntologyRelation
      summary: 编辑指定关系
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OntologyRelationWrite'}
      responses:
        '200':
          description: 编辑指定关系
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '502': {description: dbt-service 凭据无效，code 为 SERVICE_AUTHENTICATION_FAILED，retryable 为 false, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
    delete:
      operationId: deleteOntologyRelation
      summary: 删除指定关系
      security: [{bearerAuth: []}]
      parameters:
      - {name: expectedRevision, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: 删除指定关系
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OntologyMutation'}
        '400': {description: 请求格式错误, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '404': {description: 当前范围内无此资源, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '409': {description: 编辑序号、引用或活动部署冲突, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '422': {description: 字段绑定或本体定义不合法, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
        '503': {description: 图库或依赖暂不可用, content: {application/problem+json: {schema: {$ref: '#/components/schemas/OntologyProblem'}}}}
  /api/ops/tenants:
    post:
      summary: 运维原子开通租户及唯一管理者
      operationId: provisionTenant
      security:
      - operationsToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '201':
          description: 租户已开通
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id]
                properties:
                  tenant_id: {type: string, pattern: '^tn_[0-9]{5}$'}
        '401': {description: 运维凭据无效}
        '403': {description: 缺少运维权限}
        '409': {description: 登录名已占用或租户编号已耗尽}
  /api/v1/tenant/accounts:
    get:
      summary: 列出本租户可授权的只读账号
      operationId: listTenantReaders
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 只读账号列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, username]
                  properties:
                    id: {type: string, format: uuid}
                    username: {type: string}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限}
    post:
      summary: 租户管理者创建本租户只读账号
      operationId: createTenantAccount
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthTokenRequest'}
      responses:
        '201':
          description: 只读账号已创建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentitySummary'}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限}
        '409': {description: 登录名已占用}
  /api/v1/assets:
    get:
      summary: 列出本租户当前已部署资产及本人使用权限
      operationId: listMyAssets
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 后台最近成功登记的全部生效租户资产。granted 表示登录用户是否有权使用，未授权资产也会返回。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AssetAccess'}}
        '401': {description: 登录令牌无效}
  /api/v1/tenant/accounts/{userId}/assets:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 管理者查看账号在各环境当前构建中的可授权资产
      operationId: listAccountAssets
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 各环境最近成功登记的生效构建资产，按环境排列。授权按环境、类型与名称保留，维度另按所属语义模型区分。granted 表示所选账号是否具有使用权。
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AssetAccess'}}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限}
        '404': {description: 本租户账号不存在}
  /api/v1/tenant/accounts/{userId}/assets/{assetId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: assetId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      summary: 向本租户账号授予单项已部署资产的使用权
      operationId: grantAsset
      security: [{bearerAuth: []}]
      responses:
        '204': {description: 操作成功，重复请求幂等}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限}
        '404': {description: 本租户账号或资产不存在}
    delete:
      summary: 撤销资产使用权，可撤销暂未部署资产
      operationId: revokeAsset
      security: [{bearerAuth: []}]
      responses:
        '204': {description: 操作成功，重复请求幂等}
        '401': {description: 登录令牌无效}
        '403': {description: 需要租户管理者权限}
        '404': {description: 本租户账号或资产不存在}
  /api/dbt/repository/branches:
    get:
      summary: 读取服务器全局绑定的 Git 仓库及其远端分支
      description: 不接受客户端指定仓库。只读查询 refs/heads，不克隆或执行源码；仓库访问失败或超过 15 秒返回 502。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 服务器绑定的仓库及按名称排序的分支；空仓库返回空分支列表。
          content:
            application/json:
              schema:
                type: object
                required: [repository, branches]
                properties:
                  repository:
                    type: string
                    description: 服务器配置的唯一构建仓库地址
                  branches:
                    type: array
                    items:
                      type: string
                    description: 分支短名，不包含 refs/heads/ 前缀和标签
        '401':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '403':
          description: 当前身份无权执行此操作
        '404':
          description: 资源不存在或当前身份不可见
  /api/dbt/environments:
    get:
      summary: 列出当前账号所属租户的全部执行环境
      description: 管理者和只读账号均可浏览本租户的环境及其构建版本。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          description: 当前身份无权执行此操作
    post:
      summary: 创建不绑定源码的执行环境
      description: 本租户管理员可在已配置的执行实例上创建环境。环境管理权限由登录账号的租户角色决定。
      security:
      - bearerAuth: []
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentView'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '403':
          description: 当前身份无权执行此操作
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentInput'
  /api/dbt/environments/{environmentId}:
    get:
      summary: 读取环境当前配置
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
