      - normalizedTimeRange
      - sql
    PreviewResult:
      type: object
      additionalProperties: false
      properties:
        buildId:
          type: string
          format: uuid
          title: Buildid
          description: 固定构建身份
        commitSha:
          anyOf:
          - type: string
          - type: 'null'
          title: Commitsha
          description: 固定源码版本
        mode:
          type: string
          description: 节点预览结果
          const: PREVIEW
        columns:
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: 列名
              type:
                type: string
                description: 列类型
            required:
            - name
            - type
          type: array
          title: Columns
          description: 结果列及精度类型
        rows:
          items:
            items: {}
            type: array
          type: array
          title: Rows
          description: 有界结果正文
        resultTruncated:
          type: boolean
          title: Resulttruncated
          description: 引擎结果是否截断
      required:
      - buildId
      - commitSha
      - mode
      - columns
      - rows
      - resultTruncated
  securitySchemes:
    operationsToken:
      type: apiKey
      in: header
