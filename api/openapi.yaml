openapi: 3.1.0
info:
  title: 指标平台固定构建 BFF
  version: 3.0.0
  description: 平台直接读取 dbt-service 的部署历史及固定 buildId 目录和查询，不依赖 Agent。
x-protocol-version: build-deployment-v3
paths:
  /api/v1/auth/token:
    post:
      summary: Exchange one Metric Platform username and password for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
      responses:
        '200':
          description: Ten-hour bearer token and canonical effective identity
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/me:
    get:
      summary: Resolve the canonical identity represented by the current token
      responses:
        '200':
          description: Effective account identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySummary'
        '401':
          $ref: '#/components/responses/Problem'
  /api/v3/dbt/builds:
    get:
      summary: 读取平台本地构建历史
      description: repository 为必填规范仓库地址，branchName 为可选筛选；直接读取 dbt-service 的构建历史，游标绑定相同仓库及筛选。
      operationId: history_v3_builds_get
      parameters:
      - name: repository
        in: query
        required: true
        schema:
          type: string
          title: Repository
      - name: branchName
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Branchname
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BuildView_'
        '422':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
