openapi: 3.1.0
info:
  title: Metric Platform API
  version: v2
  description: dbt-service 统一发布并持有活动指针；平台认证后代理读取类型化目录与查询结果。v1 在 service-proxy 模式下使用服务兼容映射，legacy 仅用于迁移前运行。
security: [{ bearerAuth: [] }]
paths:
  /api/v1/semantic-projects:refresh:
    post:
      summary: 迁移前手动请求同步固定配置仓库的 main 分支
      description: >-
        以下行为只适用于 legacy 模式。service-proxy 模式固定返回 409 publication_managed_by_service，页面刷新只读取服务发布结果。
        需要登录，不依赖 git-sync.enabled 自动同步开关，也不要求 Webhook 密钥。
        必须配置固定 Git 仓库与项目绑定并启用 dbt 运行服务。请求不接受仓库或分支参数。
        刷新信号在下一轮 Git 同步调度中处理，
        默认间隔为 30 秒；重复信号合并。202 仅表示已受理，不表示构建或发布完成。
        构建和校验成功后才切换当前发布版本，失败保留旧版。
        远端 main 的 SHA 变化时必须创建独立任务重新全量构建，包括仅修改 README 的提交；
        SHA 与构建配置均未变化时可跳过重复构建，不跨 SHA 复用旧任务。
        完整校验的空定义可发布为空目录；构建交给 dbt，平台不执行物理表清理。
        删除定义或发布空目录不会自动删除旧构建表，发布历史和原始数据表保留。
      responses:
        '202':
          description: 刷新请求已受理
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, const: true, description: 刷新信号已加入后台调度 }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503':
          description: 固定 Git 仓库、项目绑定或 dbt 运行服务尚未配置
          content:
            application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
  /internal/git-sync/events:
    post:
      summary: 通知平台刷新配置仓库的 main 快照
      description: >-
        legacy 模式且启用 git-sync 时存在；service-proxy 模式返回 409 publication_managed_by_service。
        自定义事件请求体最多 4096 字节，使用部署密钥对原始请求体做
        HMAC-SHA256，X-Git-Signature 为 sha256= 加小写十六进制摘要。
        Forgejo 原生事件无需密钥、签名或 Authorization，最多 1048576 字节，
        X-Forgejo-Event 必须提供。仅处理 push，repository.full_name 必须匹配
        部署配置 forgejo-repository。删除分支、before 等于 after 和非 main 分支忽略。
        事件只用于唤醒，平台自行拉取配置远端；相同事件可重发，非 main 分支忽略。
        202 表示刷新信号已接收，不表示定义已生效；启动时扫描，后台调度消费刷新信号并推进在途任务。
      security: []
      parameters:
        - in: header
          name: X-Forgejo-Event
          description: 使用 Forgejo 原生协议时必填；push 以外的事件忽略。
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/GitSyncEvent' }
                - { $ref: '#/components/schemas/ForgejoPushEvent' }
      responses:
        '202': { description: 已接收刷新信号或忽略非 main 分支 }
        '400': { description: 载荷、协议版本或仓库标识错误 }
        '401': { description: 仅旧自定义协议的 HMAC 签名缺失或无效 }
        '409': { description: 发布由 dbt-service 管理 }
        '413': { description: 超过载荷上限，自定义协议 4096 字节，Forgejo 协议 1048576 字节 }
        '415': { description: 仅接受 application/json }
  /api/v1/semantic-projects:
    get:
      summary: 列出固定配置的 dbt 项目与生效版本
      responses:
        '200':
          description: 项目状态列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DbtProjectSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/catalog:
    get:
      summary: 分页读取已发布 dbt 语义目录
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string }, description: 在分页前按资源类型筛选 }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 固定 releaseId 的只读目录
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtCatalogPage' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}:
    get:
      summary: 读取已发布 dbt 资源的原生定义投影
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 只读资源定义
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtResource' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}/lineage:
    get:
      summary: 读取当前资源的有界血缘
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: 固定版本中的依赖边
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtLineage' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}/presentation:
    get:
      summary: 按已发布 dbt 原生产物即时生成可视化详情
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 类型化卡片与完整原生详情
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtResourcePresentation' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}/source:
    get:
      summary: 从构建来源 SHA 安全读取 YAML 源码
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 固定来源版本的 YAML 源码
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtSourceDocument' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/releases:
    get:
      summary: 查看项目最近发布候选和历史状态
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 最近最多 100 个版本，含已清理版本元数据
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DbtReleaseSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/releases/{releaseId}:
    get:
      summary: 查看发布版本状态与脱敏诊断
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 历史发布元数据，清理后仍保留
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtReleaseSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries:
    post:
      summary: 对固定 dbt 发布版本提交类型化指标查询
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtTypedQuery' } } }
      responses:
        '202':
          description: 查询已受理，结果通过任务 ID 读取
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/query-options:
    get:
      summary: 读取固定发布版本的多指标可组合维度与时间粒度
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: metrics, in: query, required: true, schema: { type: array, minItems: 1, items: { type: string } }, style: form, explode: true }
      responses:
        '200':
          description: MetricFlow 原生 token 的可组合选项
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQueryOptions' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries:dimension-values:
    post:
      summary: 对固定发布版本提交维度值查询
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtDimensionValuesRequest' } } }
      responses:
        '202':
          description: 维度值查询任务已受理
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries:explain:
    post:
      summary: 对固定 dbt 发布版本异步解释类型化指标查询
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtTypedQuery' } } }
      responses:
        '202':
          description: 解释任务已受理
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries/{queryId}:
    get:
      summary: 读取固定发布版本的异步查询状态与类型化结果
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: queryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 查询任务状态；DECIMAL/NUMERIC/BIGINT 值以字符串返回
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQueryStatus' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/datasets/{resourceId}:preview:
    post:
      summary: 对固定发布版本的数据集提交有界预览，不接受 SQL
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtPreviewRequest' } } }
      responses:
        '202':
          description: 预览任务已受理
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/token:
    post:
      summary: Exchange one Metric Platform username and password for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthTokenRequest' } }
      responses:
        '200':
          description: Ten-hour bearer token and canonical effective identity
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/me:
    get:
      summary: Resolve the canonical identity represented by the current token
      responses:
        '200':
          description: Effective account identity
          content:
            application/json: { schema: { $ref: '#/components/schemas/IdentitySummary' } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v2/semantic-projects:
    get:
      summary: 列出服务项目
      operationId: projects_v2_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2PublishedProject'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: 仅 service-proxy 模式启用。平台不导入资源、不发布版本；历史版本目录和新查询返回 410，已受理查询继续固定原版本。
  /api/v2/semantic-projects/{projectId}/publication:
    get:
      summary: 读取服务活动发布指针
      operationId: publication_v2_projects__project_id__publication_get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2PublishedProject'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: 仅 service-proxy 模式启用。平台不导入资源、不发布版本；历史版本目录和新查询返回 410，已受理查询继续固定原版本。
  /api/v2/semantic-projects/{projectId}/releases:
    get:
      summary: 查看服务发布历史
      operationId: releases_v2_projects__project_id__releases_get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/V2PublicationDescriptor'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: 仅 service-proxy 模式启用。平台不导入资源、不发布版本；历史版本目录和新查询返回 410，已受理查询继续固定原版本。
  /api/v2/semantic-projects/{projectId}/releases/{releaseId}:
    get:
      summary: 查看发布记录
      operationId: release_v2_projects__project_id__releases__release_id__get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Release Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2PublicationDescriptor'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: 仅 service-proxy 模式启用。平台不导入资源、不发布版本；历史版本目录和新查询返回 410，已受理查询继续固定原版本。
  /api/v2/semantic-projects/{projectId}/releases/{releaseId}/catalog:
    get:
      summary: 读取固定发布版本的目录
      operationId: catalog_v2_projects__project_id__releases__release_id__catalog_get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Release Id
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Q
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/V2ResourceKind'
          - type: 'null'
          title: Kind
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2PublishedPage'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: 仅 service-proxy 模式启用。平台不导入资源、不发布版本；历史版本目录和新查询返回 410，已受理查询继续固定原版本。
  /api/v2/semantic-projects/{projectId}/releases/{releaseId}/resources/{resourceId}:
    get:
      summary: 读取类型化资源
      operationId: resource_v2_projects__project_id__releases__release_id__resources__resource_id__get
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: releaseId
        in: path
        required: true
        schema:
          type: string
