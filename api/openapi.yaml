        description: dbt 原生选择表达式；加号等保留字符必须 URL 编码
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '422':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 平台错误包装保留服务业务诊断
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/dbt/contract:
    get:
      summary: 当前 BFF 协议和契约
      security: []
      responses:
        '200':
          description: 协议元数据
          content:
            application/json:
              schema:
                type: object
                required:
                  - protocolVersion
                  - paths
                  - components
                properties:
                  protocolVersion:
                    const: execution-snapshot
                  paths:
                    type: object
                  components:
                    type: object
components:
  schemas:
    OntologyProperty:
      type: object
      required: [id, name, columnName]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        columnName: {type: string}
        declaredType: {type: [string, 'null']}
    OntologyObject:
      type: object
      required: [id, name, datasetAssetId, primaryPropertyId, properties]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        datasetAssetId: {type: string, format: uuid}
        primaryPropertyId: {type: string, format: uuid}
        properties: {type: array, items: {$ref: '#/components/schemas/OntologyProperty'}}
    OntologyRelation:
      type: object
      required: [id, name, sourceObjectId, sourcePropertyId, targetObjectId, targetPropertyId, cardinality]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: [string, 'null']}
        sourceObjectId: {type: string, format: uuid}
        sourcePropertyId: {type: string, format: uuid}
        targetObjectId: {type: string, format: uuid}
        targetPropertyId: {type: string, format: uuid}
        cardinality: {type: string, enum: [ONE_TO_ONE, MANY_TO_ONE, ONE_TO_MANY]}
    OntologyColumnObservation:
      type: [object, 'null']
      properties:
        physicalType: {type: string}
        observedAt: {type: string, format: date-time}
        buildId: {type: string, format: uuid}
        table:
          type: object
          properties:
            instanceId: {type: string}
            catalog: {type: string}
            schema: {type: string}
            table: {type: string}
    OntologyEndpointEvidence:
      type: [object, 'null']
      properties:
        columnName: {type: string}
        declaredType: {type: [string, 'null']}
        typeSource: {type: [string, 'null'], enum: [WAREHOUSE, DECLARATION, NONE, null]}
        acceptedPhysicalType: {type: [string, 'null']}
        lastObservation: {$ref: '#/components/schemas/OntologyColumnObservation'}
        reason: {type: string}
    OntologyFinding:
      type: object
      required: [kind, id, status, reason]
      properties:
        kind: {type: string}
        id: {type: string, format: uuid}
        status: {type: string, enum: [COMPATIBLE, UNVERIFIED, NEEDS_REPAIR]}
        reason: {type: string}
        evidence: {$ref: '#/components/schemas/OntologyEndpointEvidence'}
        sourceEvidence: {$ref: '#/components/schemas/OntologyEndpointEvidence'}
        targetEvidence: {$ref: '#/components/schemas/OntologyEndpointEvidence'}
    OntologyReport:
      type: object
      required: [buildId, revision, findings]
      properties:
        buildId: {type: [string, 'null'], format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
        formatVersion: {type: integer}
        policyVersion: {type: string}
        deploymentVersion: {type: integer, format: int64, description: 本次核实对应的部署指针版本}
        findings: {type: array, items: {$ref: '#/components/schemas/OntologyFinding'}}
    OntologyTopology:
      type: object
      required: [revision, objects, relations, bindingReport]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        objects: {type: array, items: {$ref: '#/components/schemas/OntologyObject'}}
        relations: {type: array, items: {$ref: '#/components/schemas/OntologyRelation'}}
        bindingReport: {$ref: '#/components/schemas/OntologyReport'}
    OntologyDataset:
      type: object
      required: [assetId, name]
      properties:
        assetId: {type: string, format: uuid}
        name: {type: string}
    OntologyDatasets:
      type: object
      required: [buildId, datasets]
      properties:
        buildId: {type: [string, 'null'], format: uuid}
        datasets: {type: array, items: {$ref: '#/components/schemas/OntologyDataset'}}
    OntologyColumn:
      type: object
      required: [name, declaredType]
      properties:
        name: {type: string}
        declaredType: {type: [string, 'null']}
        typeSource: {type: [string, 'null'], enum: [WAREHOUSE, DECLARATION, NONE, null]}
        reason: {type: [string, 'null']}
        lastObservation: {$ref: '#/components/schemas/OntologyColumnObservation'}
    OntologyColumns:
      type: object
      required: [buildId, assetId, columns]
      properties:
        buildId: {type: string, format: uuid}
        assetId: {type: string, format: uuid}
        columns: {type: array, items: {$ref: '#/components/schemas/OntologyColumn'}}
    OntologyObjectWrite:
      type: object
      required: [expectedRevision, object]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        sourceBuildId: {type: [string, 'null'], format: uuid}
        object: {$ref: '#/components/schemas/OntologyObject'}
        acceptPhysicalTypes:
          type: [array, 'null']
          description: 仅对象更新支持。服务端重新观察并在同一图编辑内核对所有基准。
          items:
            type: object
            required: [propertyId, expectedBaselineType, observedType]
            properties:
              propertyId: {type: string, format: uuid}
              expectedBaselineType: {type: string}
              observedType: {type: string}
    OntologyRelationWrite:
      type: object
      required: [expectedRevision, relation]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        sourceBuildId: {type: [string, 'null'], format: uuid}
        relation: {$ref: '#/components/schemas/OntologyRelation'}
    OntologyMutation:
      type: object
      required: [id, revision]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
    OntologyReference:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    OntologyProblem:
      type: object
      properties:
        title: {type: string}
        detail: {type: string}
        status: {type: integer}
        code: {type: string}
        references: {type: array, items: {$ref: '#/components/schemas/OntologyReference'}}
        retryable: {type: boolean}
    AssetAccess:
      type: object
      required: [assetId, ownerId, target, kind, nodeId, dimensionName, name, selector, buildId, granted]
      properties:
        assetId: {type: string, format: uuid, description: 平台稳定资产标识}
        ownerId: {type: string, format: uuid, description: 租户管理者账号}
        environmentName: {type: string, description: 环境分组显示名，历史环境回退到环境编号}
        target:
          type: object
          required: [repository, environmentId, branchName]
          properties:
            repository: {type: string}
            environmentId: {type: string, format: uuid}
            branchName: {type: string}
        kind: {type: string, enum: [METRIC, DIMENSION, DATASET]}
        nodeId: {type: string, description: dbt 节点 unique_id}
        dimensionName: {type: string, description: 模型内维度名，其他类型为空字符串}
        name: {type: string, description: 查询名称或维度所属模型名，历史授权可显示节点标识}
        selector: {type: string, description: 当前数据集的精确预览选择器}
        buildId: {type: string, format: uuid, description: 资产所属环境的当前生效构建}
        granted: {type: boolean, description: 列表对应账号是否具有使用权，资产所有者具有使用权}
    ExecutionSnapshot:
      allOf:
        - $ref: '#/components/schemas/BuildExecutionSnapshot'
      required: [configVersion]
    BuildExecutionSnapshot:
      additionalProperties: false
      properties:
        environmentId:
          description: 外部环境稳定身份，与源码无关
          format: uuid
          title: Environmentid
          type: string
        configVersion:
          description: 兼容旧构建返回的平台配置版本，当前 dbt-service 的构建不含此字段
          minimum: 1
          title: Configversion
          type: integer
        connection:
          $ref: '#/components/schemas/ConnectionTarget'
          description: 完整非敏感物理连接目标
        credentialRef:
          description: 运行基础设施允许的 secret 引用
          maxLength: 128
          minLength: 1
          title: Credentialref
          type: string
        catalog:
          description: 目标 catalog 或适配器数据库
          pattern: ^[a-z][a-z0-9_]{0,62}$
          title: Catalog
          type: string
        schema:
          description: 物理写入 schema
          pattern: ^[a-z][a-z0-9_]{0,62}$
          title: Schema
          type: string
        threads:
          default: 1
          description: 单次 dbt 并行度
          maximum: 32
          minimum: 1
          title: Threads
          type: integer
        businessTimezone:
          default: UTC
          description: 该构建查询的业务时区
          title: Businesstimezone
          type: string
      required:
        - environmentId
        - connection
        - credentialRef
        - catalog
        - schema
      title: BuildExecutionSnapshot
      type: object
    ConnectionTarget:
      additionalProperties: false
      description: 非敏感连接信息；实例身份必须由运行基础设施核验。
      properties:
        type:
          description: 已支持的 dbt 适配器
          enum:
          - starrocks
          - postgres
          - duckdb
          title: Type
          type: string
        instanceId:
          description: 规范化物理实例身份
          maxLength: 128
          minLength: 1
          title: Instanceid
          type: string
        host:
          anyOf:
          - maxLength: 253
            type: string
          - type: 'null'
          default: null
          description: 网络数据库主机
          title: Host
        port:
          anyOf:
          - maximum: 65535
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: 网络数据库端口
          title: Port
        path:
          anyOf:
          - maxLength: 2048
            type: string
          - type: 'null'
          default: null
          description: 受控 DuckDB 文件绝对路径
          title: Path
      required:
      - type
      - instanceId
      title: ConnectionTarget
      type: object
    EnvironmentInput:
      type: object
      additionalProperties: false
      required:
      - connection
      - credentialRef
      - catalog
      - schema
      - threads
      - businessTimezone
      - name
      properties:
        connection:
          $ref: '#/components/schemas/ConnectionTarget'
        credentialRef:
          description: 运行基础设施允许的 secret 引用
          maxLength: 128
          minLength: 1
          title: Credentialref
          type: string
        catalog:
          description: 目标 catalog 或适配器数据库
          pattern: ^[a-z][a-z0-9_]{0,62}$
          title: Catalog
          type: string
        schema:
          description: 物理写入 schema
          pattern: ^[a-z][a-z0-9_]{0,62}$
          title: Schema
          type: string
        threads:
          default: 1
          description: 单次 dbt 并行度
          maximum: 32
          minimum: 1
          title: Threads
          type: integer
        businessTimezone:
          default: UTC
          description: 该构建查询的业务时区
          title: Businesstimezone
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 环境展示名称
    EnvironmentView:
      type: object
      required:
      - environmentId
      - name
      - configVersion
      - execution
      properties:
        environmentId:
          type: string
          format: uuid
        name:
          type: string
        configVersion:
          type: integer
          minimum: 1
        execution:
          $ref: '#/components/schemas/ExecutionSnapshot'
    EnvironmentPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentView'
    EnvironmentBuildPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildView'
        nextCursor:
          type:
            - string
            - 'null'
    BuildSubmission:
      type: object
      required:
      - repository
      - branchName
      - expectedConfigVersion
      - deploymentPolicy
      - idempotencyKey
      properties:
        repository:
          type: string
          maxLength: 2048
          description: 必须与服务器全局绑定的 Git 仓库地址完全一致，否则返回 422；不允许明文凭据
        branchName:
          type: string
          description: 本次显式分支，与环境无绑定
        commitSha:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{40}$
        expectedConfigVersion:
          type: integer
          minimum: 1
        deploymentPolicy:
          type: string
          enum:
          - NONE
          - ON_SUCCESS
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 256
          description: 同一次提交重试必须保持不变
    BuildStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      - OUTCOME_UNKNOWN
      title: BuildStatus
    BuildView:
      additionalProperties: false
      properties:
        buildId:
          description: 一次构建身份，与提交 SHA 无关
          format: uuid
          title: Buildid
          type: string
        repository:
          description: 规范仓库地址
          title: Repository
          type: string
        branchName:
          anyOf:
          - type: string
          - type: 'null'
          description: 请求来源分支
          title: Branchname
        requestedCommitSha:
          anyOf:
          - type: string
          - type: 'null'
          description: 受理时显式指定的 SHA
          title: Requestedcommitsha
        commitSha:
          anyOf:
          - type: string
          - type: 'null'
          description: 首次解析后固定的实际 SHA
          title: Commitsha
        toolchainVersion:
          description: 固定工具链版本
          title: Toolchainversion
          type: string
        buildStatus:
          $ref: '#/components/schemas/BuildStatus'
          description: 构建状态，不代表部署状态
        phase:
          description: 当前执行阶段
          title: Phase
          type: string
        createdAt:
          description: 受理时间
          format: date-time
          title: Createdat
          type: string
        updatedAt:
          description: 最近事实更新时间
          format: date-time
          title: Updatedat
          type: string
        finishedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: 终态时间
          title: Finishedat
        catalogAvailable:
          default: false
          description: 构建产物是否可读。被替换的部署清理产物后返回 false，构建元数据和日志继续保留。
          title: Catalogavailable
          type: boolean
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorView'
          - type: 'null'
          default: null
          description: 脱敏错误摘要
        initialDeployment:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: 受理时附带的部署意图
          title: Initialdeployment
        execution:
          $ref: '#/components/schemas/BuildExecutionSnapshot'
          description: 受理时固定的完整执行快照
      required:
      - buildId
      - repository
      - branchName
      - requestedCommitSha
      - commitSha
      - toolchainVersion
      - buildStatus
      - phase
      - createdAt
      - updatedAt
      - execution
      title: BuildView
      type: object
    DeploymentAttemptView:
      additionalProperties: false
      properties:
        repository:
          description: 规范仓库地址
          title: Repository
          type: string
        environmentId:
          description: 调用方环境 UUID
          title: Environmentid
          type: string
        branchName:
          description: 目标分支短名
          title: Branchname
          type: string
        generation:
          description: 受理顺序，不按完成时间分配
          minimum: 1
          title: Generation
          type: integer
        buildId:
          description: 该意图请求的构建
          format: uuid
          title: Buildid
          type: string
        deploymentStatus:
          $ref: '#/components/schemas/DeploymentStatus'
          description: 独立于构建的部署状态
        reason:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          description: 未部署或过期原因
          title: Reason
        createdAt:
          description: 意图受理时间
          format: date-time
          title: Createdat
          type: string
        deployedAt:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          default: null
          description: 实际切换时间
          title: Deployedat
      required:
        - repository
        - environmentId
        - branchName
        - generation
        - buildId
        - deploymentStatus
        - createdAt
      title: DeploymentAttemptView
      type: object
    DeploymentStatus:
      type: string
      enum:
      - WAITING_FOR_BUILD
      - PENDING
      - CHECKING
      - DEPLOYED
      - STALE
      - FAILED
      - CANCELLED
      title: DeploymentStatus
    DeploymentTargetView:
      additionalProperties: false
      properties:
        repository:
          description: 规范仓库地址
          title: Repository
          type: string
        environmentId:
          description: 调用方环境 UUID
          title: Environmentid
          type: string
        branchName:
          description: 目标分支短名
          title: Branchname
          type: string
        version:
          default: 0
          description: 目标乐观锁版本
          title: Version
          type: integer
        desiredGeneration:
          default: 0
          description: 最新受理意图序号
          title: Desiredgeneration
          type: integer
        activeBuildId:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          default: null
          description: 当前实际生效构建
          title: Activebuildid
        activeCommitSha:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          description: 当前实际生效提交
          title: Activecommitsha
        latestAttempt:
          anyOf:
            - $ref: '#/components/schemas/DeploymentAttemptView'
            - type: 'null'
          default: null
          description: 最新部署意图
        observedHeadSha:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          description: 最近观察远端 head
          title: Observedheadsha
        headObservedAt:
          anyOf:
            - format: date-time
              type: string
            - type: 'null'
          default: null
          description: 远端观察时间
          title: Headobservedat
        sourceState:
          default: UNDEPLOYED
          description: 远端观察结果，不替代部署终态
          title: Sourcestate
          type: string
      required:
        - repository
        - environmentId
        - branchName
      title: DeploymentTargetView
      type: object
    ErrorView:
      additionalProperties: false
      properties:
        code:
          description: 稳定错误码
          title: Code
          type: string
        message:
          description: 不含凭据或本地路径的诊断
          title: Message
          type: string
        retryable:
          default: false
          description: 能否以同请求重试
          title: Retryable
          type: boolean
        phase:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          description: 失败执行阶段
          title: Phase
        buildId:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          default: null
          description: 已有构建身份
          title: Buildid
      required:
        - code
        - message
      title: ErrorView
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AvailableDimensionsRequest:
      properties:
        metrics:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          description: dbt 指标名称集合
      additionalProperties: false
      type: object
      required:
      - metrics
      title: AvailableDimensionsRequest
    AvailableDimensionsView:
      properties:
        buildId:
          type: string
          format: uuid
          description: 固定构建身份
        dimensions:
          items:
            $ref: '#/components/schemas/DimensionOption'
          type: array
          description: 当前指标共同支持的合法选项
        metrics:
          items:
            type: string
          type: array
          description: dbt 指标名称集合
      additionalProperties: false
      type: object
      required:
      - buildId
      - metrics
      - dimensions
      title: AvailableDimensionsView
    Page_BuildView_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BuildView'
          type: array
          title: Items
          description: 本页有界结果
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: 绑定筛选条件的后续游标
        source:
          type:
          - string
          - 'null'
          description: 旧版历史投影来源。实时构建列表返回空值。
        syncedAt:
          type:
          - string
          - 'null'
          description: 旧版历史投影的同步时间。实时构建列表返回空值。
      additionalProperties: false
      type: object
      required:
      - items
      title: Page[BuildView]
    Page_DeploymentAttemptView_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DeploymentAttemptView'
          type: array
          title: Items
          description: 本页有界结果
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
          description: 绑定筛选条件的后续游标
      additionalProperties: false
      type: object
      required:
      - items
      title: Page[DeploymentAttemptView]
    QueryMode:
      type: string
      enum:
      - QUERY
      - EXPLAIN
      - PREVIEW
      - DIMENSION_VALUES
      title: QueryMode
    QueryRequest:
      description: 按 mode 严格选择请求结构，无关字段即使为 null 或空数组也拒绝
      oneOf:
      - $ref: '#/components/schemas/MetricQueryRequest'
      - $ref: '#/components/schemas/DimensionValuesRequest'
      - $ref: '#/components/schemas/PreviewRequest'
      discriminator:
        propertyName: mode
        mapping:
          QUERY: '#/components/schemas/MetricQueryRequest'
          EXPLAIN: '#/components/schemas/MetricQueryRequest'
          DIMENSION_VALUES: '#/components/schemas/DimensionValuesRequest'
          PREVIEW: '#/components/schemas/PreviewRequest'
    ResourceSourceView:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          description: 工程内相对路径
        content:
          type: string
          description: 完整封存源码正文
      required:
      - path
      - content
    ResourceView:
      type: object
      additionalProperties: false
      properties:
        buildId:
          type: string
          description: 资源和源码所属固定构建
          format: uuid
        resourceId:
          type: string
          description: dbt 原生 unique_id
        resource:
          type: object
          description: 完整原生节点定义
          additionalProperties: true
        source:
          description: 完整源码；无源码时为空
          anyOf:
          - $ref: '#/components/schemas/ResourceSourceView'
          - type: 'null'
      required:
      - buildId
      - resourceId
      - resource
    ResultPage:
      oneOf:
      - $ref: '#/components/schemas/MetricQueryResult'
      - $ref: '#/components/schemas/ExplainResult'
      - $ref: '#/components/schemas/PreviewResult'
      discriminator:
        propertyName: mode
        mapping:
          QUERY: '#/components/schemas/MetricQueryResult'
          DIMENSION_VALUES: '#/components/schemas/MetricQueryResult'
          EXPLAIN: '#/components/schemas/ExplainResult'
          PREVIEW: '#/components/schemas/PreviewResult'
    SelectedDimension:
      properties:
        optionId:
          type: string
          title: Optionid
          description: 版本及指标集合固定的选项
        grain:
          anyOf:
          - type: string
          - type: 'null'
          title: Grain
          description: 引擎支持的时间粒度
      additionalProperties: false
      type: object
      required:
      - optionId
      title: SelectedDimension
    SelectedFilter:
      properties:
        optionId:
          type: string
          title: Optionid
          description: 过滤选项身份
        operator:
          type: string
          title: Operator
          description: 选项允许的过滤操作
        value:
          title: Value
          description: 保留 JSON 类型的过滤值
      additionalProperties: false
      type: object
      required:
      - optionId
      - operator
      - value
      title: SelectedFilter
    SelectedOrder:
      properties:
        fieldId:
          type: string
          title: Fieldid
          description: 已选择的指标或分组选项
        direction:
          type: string
          enum:
          - ASC
          - DESC
          title: Direction
          description: 排序方向
      additionalProperties: false
      type: object
      required:
      - fieldId
      - direction
      title: SelectedOrder
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AuthTokenRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
    IdentitySummary:
      type: object
      required:
      - identityId
      - subject
      - displayName
      - authVersion
      - tenant_id
      - role
      properties:
        tenant_id: {type: string, pattern: '^tn_[0-9]{5}$'}
        role: {type: string, enum: [TENANT_MANAGER, READ_ONLY]}
        identityId:
          $ref: '#/components/schemas/Uuid'
        subject:
          type: string
        displayName:
          type: string
        authVersion:
          type: integer
          format: int64
          minimum: 0
    AuthTokenResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - identity
      properties:
        accessToken:
          type: string
          writeOnly: true
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          example: 36000
        identity:
          $ref: '#/components/schemas/IdentitySummary'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ExecutionLogView:
      type: object
      additionalProperties: false
      properties:
        logId:
          type: string
          description: 日志十进制字符串标识，用于去重，避免整数精度丢失
        jobId:
          type: string
          description: 所属持久任务标识
          format: uuid
        attemptId:
          type: string
          description: 执行尝试标识，用于区分重试
          format: uuid
        phase:
          type: string
          description: 事件发生的构建阶段
        command:
          type: string
          description: dbt 子命令
        eventTime:
          type: string
          description: 事件产生时间，UTC
          format: date-time
        level:
          type: string
          description: 原始日志级别
        eventName:
          type: string
          description: dbt 事件名或 Python logger 名称
        eventCode:
          type: string
          description: 事件代码，无值时为空字符串
        invocationId:
          type: string
          description: dbt 调用标识，无值时为空字符串
        nodeId:
          type: string
          description: 节点 unique_id，无值时为空字符串
        threadName:
          type: string
          description: 产生事件的线程名称
        message:
          type: string
          description: 脱敏消息，按文本渲染，可能含换行及 ANSI 转义序列
        createdAt:
          type: string
          description: 入库时间，UTC
          format: date-time
      required:
      - logId
      - jobId
      - attemptId
      - phase
      - command
      - eventTime
      - level
      - eventName
      - eventCode
      - invocationId
      - nodeId
      - threadName
      - message
      - createdAt
    ExecutionLogPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          description: 按 logId 升序返回的本页日志
          items:
            $ref: '#/components/schemas/ExecutionLogView'
        nextCursor:
          type: string
          description: 绑定构建的续读游标，空页及末页仍返回，应保留用于轮询
        hasMore:
          type: boolean
          description: 读取时是否有下一页，不表示构建结束或日志完整
      required:
      - items
      - nextCursor
      - hasMore
    NativeCatalog:
      type: array
      description: 当前账号的固定构建资源目录。指标、数据集和维度带有逐项权限；维度使用平台资产 UUID 标识。所有本租户账号可读取相同的原生元数据、血缘和源码。维度通过 semanticModelId 定位所属模型。
      items:
        type: object
        additionalProperties: true
        required:
        - unique_id
        - resource_type
        properties:
          unique_id:
            type: string
            description: dbt 原生资源唯一标识或模型内维度的平台资产 UUID
          resource_type:
            type: string
            description: 原生资源类型或平台维度类型 dimension
          granted:
            type: boolean
            description: 当前账号具有该资产的使用权限
          selector:
            type: string
            description: 数据集的精确预览选择器
          semanticModelId:
            type: string
            description: 维度所属语义模型的 dbt 原生节点标识，用于读取模型源码和血缘
          semanticModelName:
            type: string
            description: 维度所属的语义模型名称
    DimensionOption:
      type: object
      additionalProperties: false
      properties:
        granted:
          type: boolean
          description: 当前账号可在查询中使用该维度选项，系统时间维度随指标可用。
        optionId:
          type: string
          description: 固定构建和指标集合的选项身份
        name:
          type:
          - string
          - 'null'
          description: 原生维度名称
        semanticModelName:
          type:
          - string
          - 'null'
          description: 所属语义模型名称
        displayName:
          type: string
          description: 显示名称
        dimensionType:
          type: string
          description: 维度类型
        granularities:
          type: array
          description: 支持的时间粒度
          items:
            type: string
        operators:
          type: array
          description: 支持的过滤操作
          items:
            type: string
      required:
      - optionId
      - displayName
      - dimensionType
      - granularities
      - operators
    MetricQueryRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          description: 指标查询或编译模式
          enum:
          - QUERY
          - EXPLAIN
        filters:
          items:
            $ref: '#/components/schemas/SelectedFilter'
          type: array
          maxItems: 100
          title: Filters
          description: 类型化过滤条件
        startTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Starttime
          description: 起点，按构建业务时区解释
        endTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endtime
          description: 终点，按构建业务时区解释
        limit:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Limit
          description: 最多返回的结果行数
          default: 1000
        metrics:
          type: array
          description: dbt 指标名称，不能使用资源 ID
          items:
            type: string
          minItems: 1
          maxItems: 100
        groupBy:
          items:
            $ref: '#/components/schemas/SelectedDimension'
          type: array
          maxItems: 100
          title: Groupby
          description: 有序分组
        orderBy:
          items:
            $ref: '#/components/schemas/SelectedOrder'
          type: array
          maxItems: 100
          title: Orderby
          description: 有序排序条件
      required:
      - mode
      - metrics
    DimensionValuesRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          description: 维度值查询模式
          const: DIMENSION_VALUES
        filters:
          items:
            $ref: '#/components/schemas/SelectedFilter'
          type: array
          maxItems: 100
          title: Filters
          description: 类型化过滤条件
        startTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Starttime
          description: 起点，按构建业务时区解释
        endTime:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endtime
          description: 终点，按构建业务时区解释
        limit:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Limit
          description: 最多返回的结果行数
          default: 1000
        metrics:
          type: array
          description: dbt 指标名称，不能使用资源 ID
          items:
            type: string
          minItems: 1
          maxItems: 100
        dimensionOptionId:
          type: string
          description: 选定维度的 optionId
          minLength: 1
      required:
      - mode
      - metrics
      - dimensionOptionId
    PreviewRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          description: 原生节点预览模式
          const: PREVIEW
        selector:
          type: string
          description: 匹配一个非 seed 节点的 dbt 原生 selector，不能只包含空白
          minLength: 1
          pattern: \S
        limit:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Limit
          description: 最多返回的结果行数
          default: 1000
      required:
      - mode
      - selector
    MetricQueryResult:
      type: object
      additionalProperties: false
      properties:
        buildId:
          type: string
          format: uuid
          title: Buildid
          description: 固定构建身份
        commitSha:
          anyOf:
          - type: string
          - type: 'null'
          title: Commitsha
          description: 固定源码版本
        mode:
          type: string
          description: 指标或维度值结果
          enum:
          - QUERY
          - DIMENSION_VALUES
        businessTimezone:
          type: string
          title: Businesstimezone
          description: 构建固定的业务时区
        normalizedTimeRange:
          description: 按构建业务时区归一化的输入，不代表引擎粒度边界
          type: object
          additionalProperties: false
          properties:
            startTime:
              type:
              - string
              - 'null'
              description: 归一化起点
            endTime:
              type:
              - string
              - 'null'
              description: 归一化终点
          required:
          - startTime
          - endTime
        columns:
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: 列名
              type:
                type: string
                description: 列类型
            required:
            - name
            - type
          type: array
          title: Columns
          description: 结果列及精度类型
        rows:
          items:
            items: {}
            type: array
          type: array
          title: Rows
          description: 有界结果正文
        resultTruncated:
          type: boolean
          title: Resulttruncated
          description: 引擎结果是否截断
      required:
      - buildId
      - commitSha
      - mode
      - businessTimezone
      - normalizedTimeRange
      - columns
      - rows
      - resultTruncated
    ExplainResult:
      type: object
      additionalProperties: false
      properties:
        buildId:
          type: string
          format: uuid
          title: Buildid
          description: 固定构建身份
        commitSha:
          anyOf:
          - type: string
          - type: 'null'
          title: Commitsha
          description: 固定源码版本
        mode:
          type: string
          description: 编译结果模式
          const: EXPLAIN
        businessTimezone:
          type: string
          title: Businesstimezone
          description: 构建固定的业务时区
        normalizedTimeRange:
          description: 按构建业务时区归一化的输入，不代表引擎粒度边界
          type: object
          additionalProperties: false
          properties:
            startTime:
              type:
              - string
              - 'null'
              description: 归一化起点
            endTime:
              type:
              - string
              - 'null'
              description: 归一化终点
          required:
          - startTime
          - endTime
        sql:
