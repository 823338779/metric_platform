  /api/v3/dbt/contract:
    get:
      summary: 当前 BFF 协议和契约
      security: []
      responses:
        '200':
          description: 协议元数据
          content:
            application/json:
              schema:
                type: object
                required:
                - protocolVersion
                - paths
                - components
                properties:
                  protocolVersion:
                    const: build-deployment-v3
                  paths:
                    type: object
                  components:
                    type: object
components:
  schemas:
    BindingMode:
      type: string
      enum:
      - BUILT
      - REUSED
      - EXTERNAL
      title: BindingMode
    BuildStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      - OUTCOME_UNKNOWN
      title: BuildStatus
    BuildView:
      properties:
        buildId:
          type: string
          format: uuid
          title: Buildid
          description: 一次构建身份，与提交 SHA 无关
        repository:
          type: string
          title: Repository
          description: 规范仓库地址
        branchName:
          anyOf:
          - type: string
          - type: 'null'
          title: Branchname
          description: 请求来源分支
        requestedCommitSha:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestedcommitsha
          description: 受理时显式指定的 SHA
        commitSha:
          anyOf:
          - type: string
          - type: 'null'
          title: Commitsha
          description: 首次解析后固定的实际 SHA
        environment:
          $ref: '#/components/schemas/Environment'
          description: 执行环境
        executionBinding:
          type: string
          title: Executionbinding
          description: 执行配置引用
        configVersion:
          type: string
          title: Configversion
          description: 固定配置版本
        toolchainVersion:
          type: string
          title: Toolchainversion
          description: 固定工具链版本
        buildStatus:
          $ref: '#/components/schemas/BuildStatus'
          description: 构建状态，不代表部署状态
        phase:
          type: string
          title: Phase
          description: 当前执行阶段
        createdAt:
          type: string
          format: date-time
          title: Createdat
          description: 受理时间
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          description: 最近事实更新时间
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finishedat
          description: 终态时间
        cancelRequested:
          type: boolean
          title: Cancelrequested
          description: 是否已请求取消
          default: false
        catalogAvailable:
          type: boolean
