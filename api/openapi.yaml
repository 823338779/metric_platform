      - identityId
      - subject
      - displayName
      - authVersion
      properties:
        identityId:
          $ref: '#/components/schemas/Uuid'
        subject:
          type: string
        displayName:
          type: string
        authVersion:
          type: integer
          format: int64
          minimum: 0
    AuthTokenResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - identity
      properties:
        accessToken:
          type: string
          writeOnly: true
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          format: int64
          example: 36000
        identity:
          $ref: '#/components/schemas/IdentitySummary'
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
