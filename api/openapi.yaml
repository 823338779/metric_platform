openapi: 3.1.0
info:
  title: Metric Platform API
  version: v1
  description: >-
    Git 托管的数据集、字段、维度、指标和关系由仓库统一维护。
    管理写接口修改这些对象、向托管数据集追加人工定义或删除受其引用的对象时返回 409；
    普通人工对象沿用既有管理流程。
security: [{ bearerAuth: [] }]
paths:
  /internal/git-sync/events:
    post:
      summary: 通知平台刷新配置仓库的 main 快照
      description: >-
        仅启用 git-sync 时存在。请求体最多 4096 字节，使用部署密钥对原始请求体做
        HMAC-SHA256，X-Git-Signature 为 sha256= 加小写十六进制摘要。
        事件只用于唤醒，平台自行拉取配置远端；相同事件可重发，非 main 分支忽略。
        202 表示刷新信号已接收，不表示定义已生效；启动扫描和周期轮询补偿丢失信号。
      security: [{ gitWebhookHmac: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GitSyncEvent' } }
      responses:
        '202': { description: 已接收刷新信号或忽略非 main 分支 }
        '400': { description: 载荷、协议版本或仓库标识错误 }
        '401': { description: HMAC 签名缺失或无效 }
        '413': { description: 请求体超过 4096 字节 }
        '415': { description: 仅接受 application/json }
  /api/v1/git-sync/status:
    get:
      summary: 查询 Git 定义当前生效版本和最后同步错误
      description: 仅在 git-sync.enabled=true 且 mode=OSSIE 时存在；DBT 模式使用 semantic-projects 发布历史接口。
      responses:
        '200':
          description: 持久化检查点；首次发布前 appliedCommit 为空
          content:
            application/json: { schema: { $ref: '#/components/schemas/GitSyncState' } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects:
    get:
      summary: 列出固定配置的 dbt 项目与生效版本
      responses:
        '200':
          description: 项目状态列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DbtProjectSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/catalog:
    get:
      summary: 分页读取已发布 dbt 语义目录
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: 固定 releaseId 的只读目录
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtCatalogPage' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}:
    get:
      summary: 读取已发布 dbt 资源的原生定义投影
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 只读资源定义
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtResource' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/resources/{resourceId}/lineage:
    get:
      summary: 读取当前资源的有界血缘
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: 固定版本中的依赖边
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtLineage' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/releases:
    get:
      summary: 查看项目最近发布候选和历史状态
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 最近最多 100 个版本，含已清理版本元数据
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DbtReleaseSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/releases/{releaseId}:
    get:
      summary: 查看发布版本状态与脱敏诊断
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: releaseId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 历史发布元数据，清理后仍保留
          content:
            application/json: { schema: { $ref: '#/components/schemas/DbtReleaseSummary' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries:
    post:
      summary: 对固定 dbt 发布版本提交类型化指标查询
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtTypedQuery' } } }
      responses:
        '202':
          description: 查询已受理，结果通过任务 ID 读取
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries:explain:
    post:
      summary: 对固定 dbt 发布版本异步解释类型化指标查询
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtTypedQuery' } } }
      responses:
        '202':
          description: 解释任务已受理
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/queries/{queryId}:
    get:
      summary: 读取固定发布版本的异步查询状态与类型化结果
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: queryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 查询任务状态；DECIMAL/NUMERIC/BIGINT 值以字符串返回
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQueryStatus' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-projects/{projectId}/datasets/{resourceId}:preview:
    post:
      summary: 对固定发布版本的数据集提交有界预览，不接受 SQL
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: resourceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DbtPreviewRequest' } } }
      responses:
        '202':
          description: 预览任务已受理
          content: { application/json: { schema: { $ref: '#/components/schemas/DbtQuerySubmission' } } }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/token:
    post:
      summary: Exchange one Metric Platform username and password for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AuthTokenRequest' } }
      responses:
        '200':
          description: Ten-hour bearer token and canonical effective identity
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/AuthTokenResponse' } }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/auth/me:
    get:
      summary: Resolve the canonical identity represented by the current token
      responses:
        '200':
          description: Effective account identity
          content:
            application/json: { schema: { $ref: '#/components/schemas/IdentitySummary' } }
        '401': { $ref: '#/components/responses/Problem' }
  /api/v1/data-sources:
    get:
      {
        summary: List JDBC data sources,
        responses:
          {
            '200':
              {
                description: Safe data source summaries,
                content:
                  {
                    application/json:
                      {
                        schema:
                          {
                            type: array,
                            items: { $ref: '#/components/schemas/DataSourceSummary' },
                          },
                      },
                  },
              },
          },
      }
    post:
      {
        summary: Create a JDBC data source,
        requestBody: { $ref: '#/components/requestBodies/CreateDataSource' },
        responses:
          {
            '201':
              {
                description: Created,
                content:
                  {
                    application/json: { schema: { $ref: '#/components/schemas/DataSourceDetail' } },
                  },
              },
            '409': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/data-sources:validate-connection:
    post:
      {
        summary: Test unsaved JDBC settings,
        requestBody:
          {
            required: true,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ConnectionSettings' } } },
          },
        responses: { '200': { description: Test result } },
      }
  /api/v1/data-sources/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      {
        summary: Get safe data source configuration,
        responses:
          {
            '200':
              {
                description: Data source,
                content:
                  {
                    application/json: { schema: { $ref: '#/components/schemas/DataSourceDetail' } },
                  },
              },
          },
      }
    patch:
      {
        summary: Update a data source,
        responses:
          { '200': { description: Updated }, '409': { $ref: '#/components/responses/Problem' } },
      }
    delete:
      { summary: Logically delete a data source, responses: { '204': { description: Deleted } } }
  /api/v1/data-sources/{id}:test:
    post:
      {
        summary: Test a saved data source,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Test result } },
      }
  /api/v1/data-sources/{id}:activate:
    post:
      {
        summary: Activate a data source,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Activated } },
      }
  /api/v1/data-sources/{id}:deactivate:
    post:
      {
        summary: Deactivate a data source,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Deactivated } },
      }
  /api/v1/data-sources/{id}/deletion-impact:
    get:
      {
        summary: List dependent datasets,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Deletion impact } },
      }
  /api/v1/data-sources/{id}/catalogs:
    get:
      {
        summary: Discover catalogs,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Catalogs } },
      }
  /api/v1/data-sources/{id}/schemas:
    get:
      {
        summary: Discover schemas,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Schemas } },
      }
  /api/v1/data-sources/{id}/objects:
    get:
      {
        summary: Discover selectable tables and views,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses:
          {
            '200':
              {
                description: Source objects,
                content:
                  {
                    application/json:
                      {
                        schema:
                          { type: array, items: { $ref: '#/components/schemas/SourceObject' } },
                      },
                  },
              },
            '404': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/data-sources/{id}/fields:
    get:
      summary: Discover selectable fields for a source object
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: catalogName, in: query, schema: { type: string } }
        - { name: schemaName, in: query, schema: { type: string } }
        - { name: objectName, in: query, required: true, schema: { type: string } }
      responses:
        {
          '200':
            {
              description: Source fields,
              content:
                {
                  application/json:
                    {
                      schema: { type: array, items: { $ref: '#/components/schemas/SourceColumn' } },
                    },
                },
            },
          '404': { $ref: '#/components/responses/Problem' },
        }
  /api/v1/data-sources/{id}/preview:
    get:
      {
        summary: Preview 20,
        50,
        or 100 read-only rows,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses:
          {
            '200': { description: Preview rows },
            '504': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/datasets:
    get:
      {
        summary: List datasets,
        parameters:
          [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }],
        responses:
          {
            '200':
              {
                description: Dataset page,
                content:
                  { application/json: { schema: { $ref: '#/components/schemas/DatasetPage' } } },
              },
          },
      }
    post:
      {
        summary: Create dataset,
        requestBody:
          {
            required: true,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/CreateDatasetRequest' } },
              },
          },
        responses:
          {
            '201':
              {
                description: Created,
                content: { application/json: { schema: { $ref: '#/components/schemas/Dataset' } } },
              },
            '422': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/datasets/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      {
        summary: Get dataset,
        responses:
          {
            '200':
              {
                description: Dataset,
                content: { application/json: { schema: { $ref: '#/components/schemas/Dataset' } } },
              },
            '404': { $ref: '#/components/responses/Problem' },
          },
      }
    patch:
      {
        summary: Update dataset,
        requestBody:
          {
            required: true,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/UpdateDatasetRequest' } },
              },
          },
        responses:
          { '200': { description: Dataset }, '409': { $ref: '#/components/responses/Problem' } },
      }
    delete:
      {
        summary: Delete dataset,
        responses:
          { '204': { description: Deleted }, '409': { $ref: '#/components/responses/Problem' } },
      }
  /api/v1/datasets/{id}/fields:
    get:
      {
        summary: List dataset fields,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Fields } },
      }
  /api/v1/datasets/{id}/deletion-impact:
    get:
      {
        summary: Inspect deletion impact,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Impact } },
      }
  /api/v1/datasets/{id}:detect-field-changes:
    post:
      {
        summary: Detect physical schema changes,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Schema diff } },
      }
  /api/v1/datasets/{id}:sync-fields:
    post:
      {
        summary: Synchronize physical fields,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses:
          {
            '200': { description: Schema diff },
            '409': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/datasets/{id}/semantic-model:
    get:
      {
        summary: Get dataset semantic model,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Semantic model } },
      }
  /api/v1/dataset-relationships:
    get:
      { summary: List dataset relationships, responses: { '200': { description: Relationships } } }
    post:
      {
        summary: Create dataset relationship,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CreateRelationshipRequest' } },
              },
          },
        responses:
          { '201': { description: Created }, '422': { $ref: '#/components/responses/Problem' } },
      }
  /api/v1/dataset-relationships/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Get relationship, responses: { '200': { description: Relationship } } }
    patch:
      {
        summary: Update relationship,
        responses:
          {
            '200': { description: Relationship },
            '409': { $ref: '#/components/responses/Problem' },
          },
      }
    delete: { summary: Delete relationship, responses: { '204': { description: Deleted } } }
  /api/v1/dataset-relationships/{id}/deletion-impact:
    get:
      summary: Preview dependencies and warnings before deleting a relationship
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Relationship deletion impact
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResourceDeletionImpact' } }
  /api/v1/dataset-relationships/{id}:revalidate:
    post:
      {
        summary: Revalidate relationship cardinality,
        parameters: [{ $ref: '#/components/parameters/Id' }],
        responses: { '200': { description: Relationship } },
      }
  /api/v1/metrics:
    get: { summary: List metrics, responses: { '200': { description: Metric page } } }
    post:
      {
        summary: Create metric,
        requestBody:
          {
            required: true,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/CreateMetricRequest' } },
              },
          },
        responses: { '201': { description: Created } },
      }
  /api/v1/metrics/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Get metric, responses: { '200': { description: Metric } } }
    patch:
      {
        summary: Update metric,
        responses:
          { '200': { description: Metric }, '409': { $ref: '#/components/responses/Problem' } },
      }
    delete: { summary: Delete metric, responses: { '204': { description: Deleted } } }
  /api/v1/metrics/{id}/deletion-impact:
    get:
      summary: Preview dependencies and warnings before deleting a metric
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Metric deletion impact
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResourceDeletionImpact' } }
  /api/v1/dimensions:
    get: { summary: List dimensions, responses: { '200': { description: Dimension page } } }
    post:
      {
        summary: Create dimension,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CreateDimensionRequest' } },
              },
          },
        responses: { '201': { description: Created } },
      }
  /api/v1/dimensions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Get dimension, responses: { '200': { description: Dimension } } }
    patch:
      {
        summary: Update dimension,
        responses:
          { '200': { description: Dimension }, '409': { $ref: '#/components/responses/Problem' } },
      }
    delete: { summary: Delete dimension, responses: { '204': { description: Deleted } } }
  /api/v1/dimensions/{id}/deletion-impact:
    get:
      summary: Preview dependencies and warnings before deleting a dimension
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Dimension deletion impact
          content:
            application/json: { schema: { $ref: '#/components/schemas/ResourceDeletionImpact' } }
  /api/v1/capabilities:
    get:
      summary: Describe the agent-safe semantic query capabilities
      responses:
        '200':
          description: Supported features and limits
          content:
            application/json: { schema: { $ref: '#/components/schemas/CapabilitiesResponse' } }
  /api/v1/query-connectivity:
    get:
      summary: Read the semantic dataset connectivity snapshot
      responses:
        '200':
          description: Directed unique and ambiguous relationship paths
          content:
            application/json: { schema: { $ref: '#/components/schemas/QueryConnectivityResponse' } }
  /api/v1/semantic-objects:search:
    post:
      {
        summary: Search semantic objects,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/SemanticSearchRequest' } },
              },
          },
        responses:
          {
            '200':
              {
                description: Ranked search results,
                content:
                  {
                    application/json:
                      {
                        schema:
                          {
                            type: array,
                            items: { $ref: '#/components/schemas/SemanticSearchResult' },
                          },
                      },
                  },
              },
          },
      }
  /api/v1/semantic-objects:query:
    post:
      summary: Browse or search semantic objects with stable cursor pagination and facets
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SemanticObjectQueryRequest' } }
      responses:
        '200':
          description: Semantic object page
          content:
            application/json: { schema: { $ref: '#/components/schemas/SemanticObjectQueryResponse' } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/semantic-objects:resolve:
    post:
      summary: Resolve semantic objects and agent-safe relationship context
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SemanticResolveRequest' } }
      responses:
        '200':
          description: Resolved semantic context
          content:
            application/json: { schema: { $ref: '#/components/schemas/SemanticResolveResponse' } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/dimensions/{dimensionId}/members:search:
    post:
      summary: Search governed members for one dimension
      parameters:
        [
          {
            name: dimensionId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/Uuid' },
          },
        ]
      requestBody:
        required: true
        content:
          application/json:
            { schema: { $ref: '#/components/schemas/DimensionMemberSearchRequest' } }
      responses:
        '200':
          description: Canonical dimension members
          content:
            application/json:
              { schema: { $ref: '#/components/schemas/DimensionMemberSearchResponse' } }
  /api/v1/dimensions/{dimensionId}/members:query:
    post:
      summary: Browse or search governed dimension members with stable cursor pagination
      parameters:
        - name: dimensionId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/DimensionMemberQueryRequest' } }
      responses:
        '200':
          description: Dimension member page
          content:
            application/json: { schema: { $ref: '#/components/schemas/DimensionMemberQueryResponse' } }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/queries:validate:
    post:
      {
        summary: Validate query,
        requestBody: { $ref: '#/components/requestBodies/Query' },
        responses:
          {
            '200':
              {
                description: Validation summary,
                content:
                  {
                    application/json:
                      { schema: { $ref: '#/components/schemas/ValidationResponse' } },
                  },
              },
            '422': { $ref: '#/components/responses/Problem' },
          },
      }
  /api/v1/queries:
    post:
      {
        summary: Execute query,
        requestBody: { $ref: '#/components/requestBodies/Query' },
        responses:
          {
            '200':
              {
                description: Query result,
                content:
                  { application/json: { schema: { $ref: '#/components/schemas/QueryResponse' } } },
              },
            '502': { $ref: '#/components/responses/Problem' },
          },
      }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    gitWebhookHmac:
      type: apiKey
      in: header
      name: X-Git-Signature
      description: 使用共享部署密钥签名原始请求体，格式 sha256=<HMAC-SHA256 十六进制摘要>
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size:
      { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
  responses:
    Problem:
      {
        description: Problem Details,
        content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } },
      }
  requestBodies:
    Query:
      {
        required: true,
        content: { application/json: { schema: { $ref: '#/components/schemas/QueryRequest' } } },
      }
    CreateDataSource:
      {
        required: true,
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/CreateDataSourceRequest' } },
          },
      }
  schemas:
    DbtTypedQuery:
      type: object
      additionalProperties: false
      required: [releaseId, metrics]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        metrics: { type: array, minItems: 1, items: { type: string } }
        groupBy: { type: array, items: { type: string } }
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: {}
        limit: { type: integer, minimum: 1, maximum: 10000 }
    DbtPreviewRequest:
      type: object
      additionalProperties: false
      required: [releaseId]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 10000 }
    DbtQuerySubmission:
      type: object
      required: [queryId, releaseId, status]
      properties:
        queryId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [PENDING] }
    DbtQueryStatus:
      type: object
      required: [queryId, releaseId, targetCommitSha, mode, status]
      properties:
        queryId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        targetCommitSha: { type: string }
        mode: { type: string, enum: [QUERY, EXPLAIN, PREVIEW] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        columns: { type: [array, 'null'], items: { type: object } }
        rows: { type: [array, 'null'], items: { type: array } }
        errorCode: { type: [string, 'null'] }
        truncated: { type: [boolean, 'null'] }
        durationMs: { type: [integer, 'null'], format: int64 }
    DbtProjectSummary:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }
        observedSha: { type: [string, 'null'] }
        activeReleaseId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lastObservationStatus: { type: [string, 'null'] }
    DbtReleaseSummary:
      type: object
      required: [releaseId, projectId, targetCommitSha, buildSourceSha, projectDigest, state, cleanupState, createdAt]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        projectId: { type: string }
        targetCommitSha: { type: string }
        buildSourceSha: { type: string }
        projectDigest: { type: string }
        state: { type: string, enum: [PREPARING, BUILDING, VALIDATING, READY, PUBLISHED, FAILED, SUPERSEDED] }
        cleanupState: { type: string, enum: [PENDING, CLEANING, CLEANED] }
        schemaName: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    DbtCatalogPage:
      type: object
      required: [releaseId, page, size, total, resources]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        resources: { type: array, items: { $ref: '#/components/schemas/DbtResource' } }
    DbtResource:
      type: object
      required: [resourceId, nativeId, kind, name, definitionJson, queryable]
      properties:
        resourceId: { type: string }
        nativeId: { type: string }
        kind: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sourcePath: { type: [string, 'null'] }
        definitionJson: { type: string, description: 原生定义 JSON 文本的只读投影 }
        queryable: { type: boolean }
    DbtLineage:
      type: object
      required: [releaseId, resourceId, dependencies]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        resourceId: { type: string }
        dependencies: { type: array, items: { $ref: '#/components/schemas/DbtDependency' } }
    DbtDependency:
      type: object
      required: [upstreamResourceId, downstreamResourceId, kind]
      properties:
        upstreamResourceId: { type: string }
        downstreamResourceId: { type: string }
        kind: { type: string }
    GitSyncEvent:
      type: object
      additionalProperties: false
      required: [protocolVersion, repositoryId, ref]
      properties:
        protocolVersion: { type: integer, const: 1 }
        eventId: { type: [string, 'null'], description: 可选追踪标识；幂等由实际 Git SHA 和数据库检查点保证 }
        repositoryId: { type: string, minLength: 1, description: 必须与部署配置相同 }
        ref: { type: string, minLength: 1, example: refs/heads/main }
        before: { type: [string, 'null'], description: 仅供事件追踪，不参与快照选择 }
        after: { type: [string, 'null'], description: 仅供事件追踪，不参与快照选择 }
    GitSyncState:
      type: object
      required: [repositoryId, modelName]
      properties:
        repositoryId: { type: string }
        modelName: { type: string }
        appliedCommit: { type: [string, 'null'], description: 最后整体成功发布的 Git SHA }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'], description: 经过脱敏的失败信息 }
        updatedAt: { type: [string, 'null'], format: date-time }
    Uuid: { type: string, format: uuid }
    AuthTokenRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true, maxLength: 1024 }
    IdentitySummary:
      type: object
      required: [identityId, subject, displayName, authVersion]
      properties:
        identityId: { $ref: '#/components/schemas/Uuid' }
        subject: { type: string }
        displayName: { type: string }
        authVersion: { type: integer, format: int64, minimum: 0 }
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, identity]
      properties:
        accessToken: { type: string, writeOnly: true }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, example: 36000 }
        identity: { $ref: '#/components/schemas/IdentitySummary' }
    Version: { type: integer, format: int64, minimum: 0 }
    DatabaseType: { type: string, enum: [STARROCKS, MYSQL, POSTGRESQL] }
    ConnectionSettings:
      {
        type: object,
        required: [databaseType, jdbcUrl, username, password],
        properties:
          {
            databaseType: { $ref: '#/components/schemas/DatabaseType' },
            jdbcUrl: { type: string },
            username: { type: string },
            password: { type: string },
            defaultCatalog: { type: string },
            defaultSchema: { type: string },
          },
      }
    CreateDataSourceRequest:
      {
        allOf:
          [
            { $ref: '#/components/schemas/ConnectionSettings' },
            {
              type: object,
              required: [name],
              properties: { name: { type: string }, description: { type: string } },
            },
          ],
      }
    DataSourceSummary:
      {
        type: object,
        required: [id, name, databaseType, status, healthStatus],
        properties:
          {
            id: { $ref: '#/components/schemas/Uuid' },
            name: { type: string },
            databaseType: { $ref: '#/components/schemas/DatabaseType' },
            status: { enum: [ACTIVE, INACTIVE, DELETED] },
            healthStatus: { enum: [UNKNOWN, HEALTHY, UNHEALTHY] },
          },
      }
    DataSourceDetail:
      {
        allOf:
          [
            { $ref: '#/components/schemas/DataSourceSummary' },
            {
              type: object,
              properties:
                {
                  jdbcUrl: { type: string },
                  username: { type: string },
                  password: { type: string },
                  defaultCatalog: { type: string },
                  defaultSchema: { type: string },
                  version: { $ref: '#/components/schemas/Version' },
                },
            },
          ],
      }
    SourceObject:
      {
        type: object,
        required: [objectName, objectType],
        properties:
          {
            catalogName: { type: string },
            schemaName: { type: string },
            objectName: { type: string },
            objectType: { enum: [TABLE, VIEW] },
          },
      }
    SourceColumn:
      {
        type: object,
        required: [physicalName, physicalType, jdbcType, ordinal, nullable],
        properties:
          {
            physicalName: { type: string },
            physicalType: { type: string },
            jdbcType: { type: integer },
            ordinal: { type: integer },
            nullable: { type: boolean },
          },
      }
    PageResponse:
      {
        type: object,
        required: [items, total, page, size],
        properties:
          {
            items: { type: array },
            total: { type: integer },
            page: { type: integer },
            size: { type: integer },
          },
      }
    DatasetPage: { allOf: [{ $ref: '#/components/schemas/PageResponse' }] }
    DatasetField:
      { type: object, required: [id, physicalName, displayName, physicalType, selected, version] }
    Dataset:
      {
        type: object,
        required: [id, dataSourceId, name, schemaName, objectName, objectType, version, fields],
        properties:
          {
            id: { $ref: '#/components/schemas/Uuid' },
            dataSourceId: { $ref: '#/components/schemas/Uuid' },
            name: { type: string },
            aliases: { type: array, items: { type: string } },
            filterExpression: { $ref: '#/components/schemas/FilterExpression' },
            fields: { type: array, items: { $ref: '#/components/schemas/DatasetField' } },
          },
      }
    CreateDatasetRequest:
      {
        type: object,
        required: [dataSourceId, name, schemaName, objectName, selectedPhysicalFields],
        properties: { aliases: { type: array, items: { type: string } } },
      }
    UpdateDatasetRequest:
      {
        type: object,
        required: [name, version],
        properties:
          {
            filterExpression: { $ref: '#/components/schemas/FilterExpression' },
            version: { $ref: '#/components/schemas/Version' },
          },
      }
    FilterExpression:
      {
        type: object,
        properties:
          {
            logicalOperator: { enum: [AND, OR] },
            children: { type: array, items: { $ref: '#/components/schemas/FilterExpression' } },
            fieldId: { $ref: '#/components/schemas/Uuid' },
            operator:
              { enum: [EQ, NE, GT, GTE, LT, LTE, BETWEEN, IN, NOT_IN, CONTAINS, IS_NULL, IS_NOT_NULL] },
            values: { type: array },
          },
      }
    FieldPair: { type: object, required: [sourceFieldId, targetFieldId] }
    CreateRelationshipRequest:
      {
        type: object,
        required: [name, sourceDatasetId, targetDatasetId, cardinality, fieldPairs],
        properties: { cardinality: { enum: [ONE_TO_ONE, MANY_TO_ONE] } },
      }
    CreateMetricRequest:
      {
        type: object,
        required: [datasetId, name, displayName, aggregation],
        properties:
          {
            aggregation: { enum: [COUNT, COUNT_DISTINCT, SUM, AVG, MIN, MAX] },
            description: { type: string },
            businessDefinition: { type: string },
            aliases: { type: array, items: { type: string } },
            unit: { type: string },
            formatPattern: { type: string },
          },
      }
    CreateDimensionRequest:
      {
        type: object,
        required: [datasetId, datasetFieldId, name, displayName, type, allowedGranularities],
        properties:
          {
            type: { enum: [STANDARD, TIME] },
            allowedGranularities:
              { type: array, items: { enum: [DAY, WEEK, MONTH, QUARTER, YEAR] } },
            description: { type: string },
            businessDefinition: { type: string },
            aliases: { type: array, items: { type: string } },
          },
      }
    DimensionSelection:
      {
        type: object,
        required: [dimensionId],
        properties:
          {
            dimensionId: { $ref: '#/components/schemas/Uuid' },
            granularity: { enum: [DAY, WEEK, MONTH, QUARTER, YEAR] },
          },
      }
    DimensionFilter:
      type: object
      required: [dimensionId, operator]
      properties:
        dimensionId: { $ref: '#/components/schemas/Uuid' }
        operator: { enum: [EQ, NE, GT, GTE, LT, LTE, BETWEEN, IN, CONTAINS, IS_NULL, IS_NOT_NULL] }
        values: { type: array, items: {} }
    TimeRange:
      type: object
      required: [dimensionId, timezone]
      properties:
        dimensionId: { $ref: '#/components/schemas/Uuid' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        preset:
          {
            enum:
              [
                TODAY,
                YESTERDAY,
                LAST_7_DAYS,
                LAST_30_DAYS,
                MONTH_TO_DATE,
                QUARTER_TO_DATE,
                YEAR_TO_DATE,
                LAST_MONTH,
                LAST_QUARTER,
                LAST_YEAR,
              ],
          }
        timezone: { type: string, example: Asia/Shanghai }
    SortSelection:
      type: object
      required: [type, objectId, direction]
      properties:
        type: { enum: [METRIC, DIMENSION] }
        objectId: { $ref: '#/components/schemas/Uuid' }
        direction: { enum: [ASC, DESC] }
    QueryRequest:
      type: object
      required: [metricIds]
      properties:
        metricIds: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
        dimensions: { type: array, items: { $ref: '#/components/schemas/DimensionSelection' } }
        relationshipIds:
          { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        filters: { type: array, items: { $ref: '#/components/schemas/DimensionFilter' } }
        timeRange: { $ref: '#/components/schemas/TimeRange' }
        sort: { type: array, items: { $ref: '#/components/schemas/SortSelection' } }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
    ResultColumn:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        semanticType: { enum: [METRIC, DIMENSION] }
        semanticObjectId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        logicalType: { type: string }
        unit: { type: string }
        formatPattern: { type: string }
        granularity: { enum: [DAY, WEEK, MONTH, QUARTER, YEAR] }
    QueryResponse:
      type: object
      required: [columns, rows, metrics, dimensions, queryId, rowCount, truncated, durationMs]
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ResultColumn' } }
        rows: { type: array, items: { type: array, items: {} } }
        queryId: { $ref: '#/components/schemas/Uuid' }
        rowCount: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        appliedFilters: { type: array, items: { $ref: '#/components/schemas/DimensionFilter' } }
        appliedTimeRange: { $ref: '#/components/schemas/TimeRange' }
        freshnessWarnings: { type: array, items: { type: string } }
        catalogVersion: { type: string }
        evidence: { $ref: '#/components/schemas/QueryEvidence' }
        sql: { type: string, description: Complete rendered SQL for authorized interactive users }
        durationMs: { type: integer, format: int64, minimum: 0 }
    QueryEvidence:
      type: object
      required: [queryId, catalogVersion, definitionVersions, relationshipIds]
      properties:
        queryId: { $ref: '#/components/schemas/Uuid' }
        catalogVersion: { type: string }
        definitionVersions:
          { type: object, additionalProperties: { $ref: '#/components/schemas/Version' } }
        relationshipIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } }
    ValidationResponse:
      type: object
      required:
        [
          valid,
          metrics,
          dimensions,
          aggregates,
          resolvedRelationshipIds,
          parameterCount,
          issues,
          warnings,
        ]
      properties:
        valid: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        warnings: { type: array, items: { type: string } }
        normalizedRequest: { $ref: '#/components/schemas/QueryRequest' }
        catalogVersion: { type: string }
        planToken: { type: [string, 'null'] }
    ValidationIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        objectType: { enum: [DATASET, METRIC, DIMENSION] }
        objectId: { $ref: '#/components/schemas/Uuid' }
        candidatePaths:
          { type: array, items: { $ref: '#/components/schemas/RelationshipPathSummary' } }
    SemanticSearchRequest:
      {
        type: object,
        required: [query],
        properties:
          {
            query: { type: string },
            datasetIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } },
            objectTypes: { type: array, items: { enum: [DATASET, METRIC, DIMENSION] } },
            domains: { type: array, items: { type: string } },
            statuses: { type: array, items: { type: string } },
            certifiedOnly: { type: boolean, default: false },
            topK: { type: integer, minimum: 1, maximum: 100, default: 20 },
          },
      }
    SemanticObjectQueryRequest:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        types:
          type: array
          uniqueItems: true
          items: { enum: [DATASET, METRIC, DIMENSION] }
        datasetIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        domains: { type: array, uniqueItems: true, items: { type: string } }
        statuses: { type: array, uniqueItems: true, items: { type: string } }
        certifiedOnly: { type: boolean, default: false }
        sort: { enum: [RELEVANCE_DESC, NAME_ASC, UPDATED_AT_DESC] }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor:
          type: string
          description: Opaque continuation token bound to the catalog version and sort order
    PageInfo:
      type: object
      required: [hasMore, limit]
      properties:
        nextCursor: { type: string }
        hasMore: { type: boolean }
        limit: { type: integer, minimum: 1, maximum: 100 }
    SemanticObjectFacets:
      type: object
      required: [types, domains, statuses]
      properties:
        types:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        domains:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
        statuses:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    SemanticObjectQueryResponse:
      type: object
      required: [items, pageInfo, facets, catalogVersion]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SemanticSearchResult' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
        facets: { $ref: '#/components/schemas/SemanticObjectFacets' }
        catalogVersion: { type: string }
    SemanticSearchResult:
      type: object
      required: [type, id, datasetId, name, aliases, score, matchReasons, version, summary]
      properties:
        type: { enum: [DATASET, METRIC, DIMENSION] }
        id: { $ref: '#/components/schemas/Uuid' }
        datasetId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        aliases: { type: array, items: { type: string } }
        score: { type: number, format: double }
        matchReasons: { type: array, items: { type: string } }
        status: { type: string }
        certificationStatus: { type: string }
        domain: { type: string }
        version: { $ref: '#/components/schemas/Version' }
        updatedAt: { type: string, format: date-time }
        summary: { type: object, additionalProperties: true }
    SemanticObjectReference:
      type: object
      required: [type, id]
      properties:
        type: { enum: [DATASET, METRIC, DIMENSION] }
        id: { $ref: '#/components/schemas/Uuid' }
    SemanticResolveRequest:
      type: object
      required: [objects]
      properties:
        objects:
          {
            type: array,
            minItems: 1,
            items: { $ref: '#/components/schemas/SemanticObjectReference' },
          }
        relationshipIds:
          { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    RelationshipPathSummary:
      type: object
      required: [relationshipId, name, sourceDatasetId, targetDatasetId, cardinality, fanoutSafe]
      properties:
        relationshipId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        displayPath: { type: string }
        sourceDatasetId: { $ref: '#/components/schemas/Uuid' }
        targetDatasetId: { $ref: '#/components/schemas/Uuid' }
        cardinality: { type: string }
        semanticRole: { type: string }
        fanoutSafe: { type: boolean }
    ResolvedSemanticObject:
      type: object
      required: [type, id, datasetId, name, aliases, version]
      properties:
        type: { enum: [DATASET, METRIC, DIMENSION] }
        id: { $ref: '#/components/schemas/Uuid' }
        datasetId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        displayName: { type: string }
        description: { type: string }
        businessDefinition: { type: string }
        aliases: { type: array, items: { type: string } }
        domain: { type: string }
        owner: { type: string }
        status: { type: string }
        certificationStatus: { type: string }
        datasetGrain: { type: string }
        unit: { type: string }
        formatPattern: { type: string }
        valueType: { type: string }
        allowedGranularities: { type: array, items: { enum: [DAY, WEEK, MONTH, QUARTER, YEAR] } }
        freshnessPolicy: { type: string }
        qualityStatus: { type: string }
        version: { $ref: '#/components/schemas/Version' }
    SemanticResolveResponse:
      type: object
      required: [catalogVersion, objects, relationshipPaths]
      properties:
        catalogVersion: { type: string }
        objects: { type: array, items: { $ref: '#/components/schemas/ResolvedSemanticObject' } }
        relationshipPaths:
          { type: array, items: { $ref: '#/components/schemas/RelationshipPathSummary' } }
    CapabilitiesResponse:
      type: object
      required: [apiVersion, catalogVersion, queryFeatures, limits, timePresets, planTokenSupported]
      properties:
        apiVersion: { type: string }
        catalogVersion: { type: string }
        queryFeatures: { type: array, items: { type: string } }
        limits: { type: object, additionalProperties: { type: integer } }
        timePresets: { type: array, items: { type: string } }
        planTokenSupported: { type: boolean }
    QueryConnectivityResponse:
      type: object
      required: [catalogVersion, datasets, paths]
      properties:
        catalogVersion: { type: string }
        datasets:
          type: array
          items: { $ref: '#/components/schemas/DatasetConnectivity' }
        paths:
          type: array
          items: { $ref: '#/components/schemas/ConnectivityPath' }
    DatasetConnectivity:
      type: object
      required: [datasetId, dataSourceId]
      properties:
        datasetId: { $ref: '#/components/schemas/Uuid' }
        dataSourceId: { $ref: '#/components/schemas/Uuid' }
    ConnectivityPath:
      type: object
      required: [sourceDatasetId, targetDatasetId, status, relationshipIds]
      properties:
        sourceDatasetId: { $ref: '#/components/schemas/Uuid' }
        targetDatasetId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [UNIQUE_PATH, AMBIGUOUS_PATH] }
        relationshipIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
    DimensionMemberSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        mode: { enum: [AUTO, EXACT, PREFIX, CONTAINS], default: AUTO }
        topK: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DimensionMemberQueryRequest:
      type: object
      properties:
        text: { type: string, minLength: 1 }
        mode: { enum: [AUTO, EXACT, PREFIX, CONTAINS], default: AUTO }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor:
          type: string
          description: Opaque continuation token bound to the dimension and member version
    DimensionMember:
      type: object
      required: [value, displayValue]
      properties:
        value: { type: string }
        displayValue: { type: string }
    DimensionMemberSearchResponse:
      type: object
      required: [dimensionId, members, truncated]
      properties:
        dimensionId: { $ref: '#/components/schemas/Uuid' }
        members: { type: array, items: { $ref: '#/components/schemas/DimensionMember' } }
        truncated: { type: boolean }
    DimensionMemberQueryResponse:
      type: object
      required: [dimensionId, items, pageInfo, memberVersion]
      properties:
        dimensionId: { $ref: '#/components/schemas/Uuid' }
        items: { type: array, items: { $ref: '#/components/schemas/DimensionMember' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
        memberVersion: { type: string }
    DependentResource:
      type: object
      required: [type, id, name, reason]
      properties:
        type: { type: string }
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        reason: { type: string }
    ResourceDeletionImpact:
      type: object
      required: [resourceId, deletable, dependencies, warnings]
      properties:
        resourceId: { $ref: '#/components/schemas/Uuid' }
        deletable: { type: boolean }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/DependentResource' }
        warnings: { type: array, items: { type: string } }
    Problem:
      {
        type: object,
        required: [type, title, status, detail],
        properties:
          {
            type: { type: string, format: uri },
            title: { type: string },
            status: { type: integer },
            detail: { type: string },
          },
      }
