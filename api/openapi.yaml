components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    gitWebhookHmac:
      type: apiKey
      in: header
      name: X-Git-Signature
      description: 使用共享部署密钥签名原始请求体，格式 sha256=<HMAC-SHA256 十六进制摘要>
  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    V2Branch:
      type: object
      description: 由 dbt-service 登记的独立分支实例；同 ref 重建时 ID 变化。
      required:
      - projectId
      - branchId
      - gitRef
      - mode
      - status
      - version
      - baseCommitSha
      - baseReleaseId
      - observedHeadSha
      - activeReleaseId
      - latestReleaseId
      - mergeRequestUrl
      properties:
        projectId:
          type: string
        branchId:
          type: string
          format: uuid
        gitRef:
          type: string
        mode:
          type: string
          enum:
          - PRODUCTION
          - PREVIEW
        status:
          type: string
          enum:
          - PROVISIONING
          - ACTIVE
          - DELETING
          - DELETED
          - FAILED
        version:
          type: integer
          minimum: 1
        baseCommitSha:
          type:
          - string
          - 'null'
        baseReleaseId:
          type:
          - string
          - 'null'
        observedHeadSha:
          type:
          - string
          - 'null'
        activeReleaseId:
          type:
          - string
          - 'null'
        latestReleaseId:
          type:
          - string
          - 'null'
        mergeRequestUrl:
          type:
          - string
          - 'null'
    V2BranchDiff:
      type: object
      required:
      - branchId
      - releaseId
      - baseCommitSha
      - targetCommitSha
      - productionAdvanced
      - resourceBaselineAvailable
      - files
      - resources
      - truncated
      properties:
        branchId:
          type: string
          format: uuid
        releaseId:
          type: string
          format: uuid
        baseCommitSha:
          type:
          - string
          - 'null'
        targetCommitSha:
          type: string
        productionAdvanced:
          type: boolean
        resourceBaselineAvailable:
          type: boolean
        truncated:
          type: boolean
        files:
          type: array
          items:
            type: object
            required:
            - path
            - status
            - diff
            properties:
              path:
                type: string
              status:
                type: string
              diff:
                type: string
        resources:
          type: array
          items:
            type: object
            required:
            - nativeId
            - kind
            - status
            properties:
              nativeId:
                type: string
              kind:
                type: string
              status:
                type: string
    DbtResourcePresentation:
      type: object
      required: [releaseId, resourceId, kind, title, sections, nativeDetails, queryable]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        resourceId: { type: string }
        kind: { type: string }
        title: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [title, fields]
            properties:
              title: { type: string }
              fields: { type: object, additionalProperties: true }
        nativeDetails: { type: object, additionalProperties: true }
        queryable: { type: boolean }
    DbtSourceDocument:
      type: object
      required: [releaseId, buildSourceSha, sourcePath, content]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        buildSourceSha: { type: string }
        sourcePath: { type: string }
        content: { type: string }
    DbtTypedQuery:
      type: object
      additionalProperties: false
      required: [releaseId, metrics]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        metrics: { type: array, minItems: 1, items: { type: string } }
        groupBy: { type: array, items: { type: string } }
        filters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string }
              value: {}
        limit: { type: integer, minimum: 1, maximum: 10000 }
        startTime: { type: string, format: date-time, description: 带时区的开始时刻；平台转换为 Asia/Shanghai 业务日历时间后交给引擎，并按查询时间粒度对齐。 }
        endTime: { type: string, format: date-time, description: 带时区的结束时刻；平台转换为 Asia/Shanghai 业务日历时间后交给引擎。按天查询包含结束日期。 }
        orderBy: { type: array, items: { type: string } }
    DbtDimensionValuesRequest:
      type: object
      additionalProperties: false
      required: [releaseId, metrics, dimension]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        metrics: { type: array, minItems: 1, items: { type: string } }
        dimension: { type: string }
        filters: { $ref: '#/components/schemas/DbtTypedQuery/properties/filters' }
        limit: { type: integer, minimum: 1, maximum: 10000 }
    DbtQueryOptions:
      type: object
      required: [releaseId, metrics, dimensions, timeDimensions, allowedFilters]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        metrics: { type: array, items: { type: object, properties: { name: { type: string } } } }
        dimensions: { type: array, items: { type: object, properties: { token: { type: string }, name: { type: string }, type: { type: string } } } }
        timeDimensions: { type: array, items: { type: object, properties: { token: { type: string }, granularity: { type: string } } } }
        allowedFilters: { type: array, items: { type: string } }
    DbtPreviewRequest:
      type: object
      additionalProperties: false
      required: [releaseId]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        limit: { type: integer, minimum: 1, maximum: 10000 }
    DbtQuerySubmission:
      type: object
      required: [queryId, releaseId, status]
      properties:
        queryId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [PENDING] }
    DbtQueryStatus:
      type: object
      required: [queryId, releaseId, targetCommitSha, mode, status]
      properties:
        queryId: { $ref: '#/components/schemas/Uuid' }
        releaseId: { $ref: '#/components/schemas/Uuid' }
        targetCommitSha: { type: string }
        mode: { type: string, enum: [QUERY, EXPLAIN, PREVIEW, DIMENSION_VALUES] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        columns: { type: [array, 'null'], items: { type: object } }
        rows: { type: [array, 'null'], items: { type: array } }
        errorCode: { type: [string, 'null'] }
        truncated: { type: [boolean, 'null'] }
        durationMs: { type: [integer, 'null'], format: int64 }
        sql:
          type: [string, 'null']
          description: EXPLAIN 模式完成后生成的 SQL；仅用于查看查询逻辑，不表示已经执行取数。其他模式或未完成时可为空。
    DbtProjectSummary:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }
        observedSha: { type: [string, 'null'] }
        activeReleaseId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lastObservationStatus: { type: [string, 'null'] }
        lastObservedAt: { type: [string, 'null'], format: date-time, description: 最近一次完成远端观测的时间，用于区别新刷新结果与历史状态 }
    DbtReleaseSummary:
      type: object
      required: [releaseId, projectId, targetCommitSha, buildSourceSha, projectDigest, state, cleanupState, createdAt]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        projectId: { type: string }
        targetCommitSha: { type: string }
        buildSourceSha: { type: string }
        projectDigest: { type: string }
        state: { type: string, enum: [PREPARING, BUILDING, VALIDATING, READY, PUBLISHED, FAILED, SUPERSEDED] }
        cleanupState: { type: string, enum: [PENDING, CLEANING, CLEANED] }
        schemaName: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
    DbtCatalogPage:
      type: object
      required: [releaseId, page, size, total, resources]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        resources: { type: array, items: { $ref: '#/components/schemas/DbtResource' } }
    DbtResource:
      type: object
      required: [resourceId, nativeId, kind, name, definitionJson, queryable]
      properties:
        resourceId: { type: string }
        nativeId: { type: string }
        kind: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        sourcePath: { type: [string, 'null'] }
        definitionJson: { type: string, description: 原生定义 JSON 文本的只读投影 }
        queryable: { type: boolean }
    DbtLineage:
      type: object
      required: [releaseId, resourceId, dependencies]
      properties:
        releaseId: { $ref: '#/components/schemas/Uuid' }
        resourceId: { type: string }
        dependencies: { type: array, items: { $ref: '#/components/schemas/DbtDependency' } }
    DbtDependency:
      type: object
      required: [upstreamResourceId, downstreamResourceId, kind]
      properties:
        upstreamResourceId: { type: string }
        downstreamResourceId: { type: string }
        kind: { type: string }
    ForgejoPushEvent:
      type: object
      description: Forgejo 原生 Push 载荷；额外字段允许但不参与构建参数。
      required: [ref, before, after, repository]
      properties:
        ref: { type: string, minLength: 1, description: 完整 Git 引用，仅 refs/heads/main 触发 }
        before: { type: string, pattern: '^[0-9a-f]{40}$', description: 更新前的提交 SHA }
        after: { type: string, pattern: '^[0-9a-f]{40}$', description: 更新后的提交 SHA，全零表示删除分支 }
        repository:
          type: object
          required: [full_name]
          properties:
            full_name: { type: string, description: 部署配置中的 owner/repository 全名 }
    GitSyncEvent:
      type: object
      additionalProperties: false
      required: [protocolVersion, repositoryId, ref]
      properties:
        protocolVersion: { type: integer, const: 1 }
        eventId: { type: [string, 'null'], description: 可选追踪标识；幂等由实际 Git SHA 和数据库检查点保证 }
        repositoryId: { type: string, minLength: 1, description: 必须与部署配置相同 }
        ref: { type: string, minLength: 1, example: refs/heads/main }
        before: { type: [string, 'null'], description: 仅供事件追踪，不参与快照选择 }
        after: { type: [string, 'null'], description: 仅供事件追踪，不参与快照选择 }
    Uuid: { type: string, format: uuid }
    AuthTokenRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, writeOnly: true, maxLength: 1024 }
    IdentitySummary:
      type: object
      required: [identityId, subject, displayName, authVersion]
      properties:
        identityId: { $ref: '#/components/schemas/Uuid' }
        subject: { type: string }
        displayName: { type: string }
        authVersion: { type: integer, format: int64, minimum: 0 }
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, identity]
      properties:
        accessToken: { type: string, writeOnly: true }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, format: int64, example: 36000 }
        identity: { $ref: '#/components/schemas/IdentitySummary' }
    Problem:
      {
        type: object,
        required: [type, title, status, detail],
        properties:
          {
            type: { type: string, format: uri },
            title: { type: string },
            status: { type: integer },
            detail: { type: string },
          },
      }

    V2HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/V2ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    V2PublishedQueryRequest:
      properties:
        releaseId:
          type: string
          format: uuid
          title: Releaseid
        idempotencyKey:
          type: string
          maxLength: 256
          minLength: 1
          title: Idempotencykey
        mode:
          $ref: '#/components/schemas/V2QueryMode'
        metricResourceIds:
          items:
            type: string
          type: array
          title: Metricresourceids
        groupBy:
          items:
            $ref: '#/components/schemas/V2SelectedDimension'
          type: array
          title: Groupby
        filters:
          items:
            $ref: '#/components/schemas/V2SelectedFilter'
          type: array
          title: Filters
        startTime:
          description: 带时区的开始时刻；平台转换为 Asia/Shanghai 业务日历时间后交给引擎，并按查询时间粒度对齐。
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Starttime
        endTime:
          description: 带时区的结束时刻；平台转换为 Asia/Shanghai 业务日历时间后交给引擎。按天查询包含结束日期。
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endtime
        orderBy:
          items:
            $ref: '#/components/schemas/V2SelectedOrder'
          type: array
          title: Orderby
        limit:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Limit
          default: 1000
        datasetResourceId:
          anyOf:
          - type: string
          - type: 'null'
          title: Datasetresourceid
        dimensionOptionId:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimensionoptionid
      additionalProperties: false
      type: object
      required:
      - releaseId
      - idempotencyKey
      - mode
      title: PublishedQueryRequest
    V2QueryMode:
      type: string
      enum:
      - QUERY
      - EXPLAIN
      - PREVIEW
      - DIMENSION_VALUES
      title: QueryMode
      description: MetricFlow 平台查询模式。
    V2QueryOptionsRequest:
      properties:
        releaseId:
          type: string
          format: uuid
          title: Releaseid
        metricResourceIds:
          items:
            type: string
          type: array
          minItems: 1
          title: Metricresourceids
      additionalProperties: false
      type: object
      required:
      - releaseId
      - metricResourceIds
      title: QueryOptionsRequest
    V2ResourceKind:
      type: string
      enum:
      - METRIC
      - DIMENSION
      - SEMANTIC_MODEL
      - TABLE
      - VIEW
      title: ResourceKind
    V2SelectedDimension:
      properties:
        optionId:
          type: string
          title: Optionid
        grain:
          anyOf:
          - type: string
          - type: 'null'
          title: Grain
      additionalProperties: false
      type: object
      required:
      - optionId
      title: SelectedDimension
    V2SelectedFilter:
      properties:
        optionId:
          type: string
          title: Optionid
        operator:
          type: string
          title: Operator
        value:
          title: Value
      additionalProperties: false
      type: object
      required:
      - optionId
      - operator
      - value
      title: SelectedFilter
    V2SelectedOrder:
      properties:
        fieldId:
          type: string
          title: Fieldid
        direction:
          type: string
          enum:
          - ASC
          - DESC
          title: Direction
      additionalProperties: false
      type: object
      required:
      - fieldId
      - direction
      title: SelectedOrder
    V2ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    V2BindingMode:
      enum:
      - BUILT
      - REUSED
      - EXTERNAL
      title: BindingMode
      type: string
    V2CatalogRelation:
      additionalProperties: false
      properties:
        upstreamResourceId:
          title: Upstreamresourceid
          type: string
        downstreamResourceId:
          title: Downstreamresourceid
          type: string
        kind:
          title: Kind
          type: string
      required:
      - upstreamResourceId
      - downstreamResourceId
      - kind
      title: CatalogRelation
      type: object
    V2DatasetAttributes:
      additionalProperties: false
      properties:
        modelResourceId:
          title: Modelresourceid
          type: string
        dimensionIds:
          items:
            type: string
          title: Dimensionids
          type: array
        entities:
          items:
            additionalProperties: true
            type: object
          title: Entities
          type: array
        measures:
          items:
            additionalProperties: true
            type: object
          title: Measures
          type: array
        defaultTimeDimension:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Defaulttimedimension
      required:
      - modelResourceId
      - dimensionIds
      - entities
      - measures
      title: DatasetAttributes
      type: object
    V2DatasetResource:
      additionalProperties: false
      properties:
        resourceId:
          title: Resourceid
          type: string
        nativeId:
          title: Nativeid
