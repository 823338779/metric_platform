# 指标平台启动配置：服务参数直接在本文件维护，IDEA 与命令行启动均自动加载。
spring:
  # Spring 应用标识，用于日志与监控中的服务识别。
  application:
    name: metric-platform
  # 平台自身的 PostgreSQL 存储连接及账号，不是 dbt 的目标数据仓库。
  datasource:
    url: jdbc:postgresql://localhost:5432/metric_platform
    username: data_agent
    password: data_agent_local_dev
  # 启动时执行平台数据库的版本化结构迁移。
  flyway:
    enabled: true
  data:
    # 认证令牌等平台缓存使用的 Redis 连接及账号。
    redis:
      host: localhost
      port: 6379
      username: default
      password: redis_local_dev
# 持久化类型处理器的扫描包。
mybatis-plus:
  type-handlers-package: com.metricplatform.persistence
# HTTP 服务监听端口。
server:
  port: 8090
# Actuator 暴露端点及存活、就绪探针。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
metric-platform:
  git-sync:
    # 仅关闭启动自动扫描和 Webhook，页面按钮仍可手动触发。
    enabled: false
    # 固定仓库与项目绑定，须与 dbt 运行服务的绑定保持一致。
    repository-id: metrics_store
    # 与 metrics_store 的 origin 一致，只读取 Git 服务端 main 的已提交内容。
    remote: http://127.0.0.1:3000/agent-admin/metrics.git
    executable: git
    # 服务维护的 Git 缓存目录，启动工作目录变化不影响该绝对路径。
    cache-directory: E:/IdeaProjects/agent-root/tmp/metric-debug/git-cache
    project-id: ecommerce_metrics
    project-subdir: .
    profile-binding-id: starrocks
    # 构建表与视图固定写入 dbt_ecom，通过每次运行的表名前缀隔离版本。
    schema-name: dbt_ecom
    # 与当前已发布版本使用的运行配置及工具链标识一致。
    # 固定物理库配置变更后，同一 SHA 也需在下次手动刷新时重新构建。
    config-version: local-debug-v8
    toolchain-version: dbt-core 1.12.5 / metricflow 0.213.0
    # 手动刷新信号及在途构建状态的检查间隔、Git 命令超时。
    poll-interval: PT5S
    git-timeout: PT30S
    # Webhook 签名密钥直接在此填写；当前手动模式保留为空。
    webhook-secret: ""
  dbt-runtime:
    # 构建和查询执行服务；开启客户端本身不会提交构建任务。
    enabled: true
    base-uri: http://127.0.0.1:8000
    timeout: PT30S
  identity-auth:
    # 认证开关、令牌有效期、登录锁定阈值、锁定时长和请求频率限制。
    enabled: true
    token-ttl: PT10H
    lock-threshold: 5
    lock-duration: PT15M
    rate-limit: 10
    rate-window: PT1M
    bootstrap:
      # 首次启动的管理员初始化开关及账号信息。
      enabled: true
      username: admin
      display-name: Platform Administrator
      password: admin
