# 指标平台启动配置：服务参数直接在本文件维护，IDEA 与命令行启动均自动加载。
spring:
  # Spring 应用标识，用于日志与监控中的服务识别。
  application:
    name: metric-platform
  # 平台自身的 PostgreSQL 存储连接及账号，不是 dbt 的目标数据仓库。
  datasource:
    url: jdbc:postgresql://localhost:5432/metric_platform
    username: data_agent
    password: data_agent_local_dev
  # 启动时执行平台数据库的版本化结构迁移。
  flyway:
    enabled: true
  data:
    # 认证令牌等平台缓存使用的 Redis 连接及账号。
    redis:
      host: localhost
      port: 6379
      username: default
      password: redis_local_dev
# 持久化类型处理器的扫描包。
mybatis-plus:
  type-handlers-package: com.metricplatform.persistence
# HTTP 服务监听端口。
server:
  port: 8090
# Actuator 暴露端点及存活、就绪探针。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
metric-platform:
  git:
    # 全局唯一构建仓库；浏览器只能选择该仓库中已存在的分支。
    repository: ${METRIC_GIT_REPOSITORY:https://github.com/823338779/metric_store.git}
  dbt-runtime:
    # 构建和查询执行服务；平台仅提供只读目录与查询代理。
    base-uri: ${DBT_SERVICE_BASE_URI:http://127.0.0.1:8000}
    service-token: ${DBT_SERVICE_TOKEN:}
    timeout: PT30S
    query-timeout: ${DBT_SERVICE_QUERY_TIMEOUT:PT1860S}
  identity-auth:
    # 认证开关、令牌有效期、登录锁定阈值、锁定时长和请求频率限制。
    enabled: true
    token-ttl: PT10H
    lock-threshold: 5
    lock-duration: PT15M
    rate-limit: 10
    rate-window: PT1M
    bootstrap:
      # 首次启动的管理员初始化开关及账号信息。
      enabled: true
      username: admin
      display-name: Platform Administrator
      password: admin
