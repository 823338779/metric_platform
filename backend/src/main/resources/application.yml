spring:
  application:
    name: metric-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/metric_platform
    username: data_agent
    password: data_agent_local_dev
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: redis_local_dev
mybatis-plus:
  type-handlers-package: com.metricplatform.persistence
server:
  port: 8090
metric-platform:
  identity-auth:
    enabled: true
    token-ttl: PT10H
    lock-threshold: 5
    lock-duration: PT15M
    rate-limit: 10
    rate-window: PT1M
    bootstrap:
      enabled: true
      username: admin
      display-name: Platform Administrator
      password: admin
