services:
  neo4j:
    image: neo4j:2026.10.1
    restart: unless-stopped
    profiles: ["ontology"]
    environment:
      NEO4J_AUTH: neo4j/${METRIC_NEO4J_PASSWORD:-}
    ports:
      - "127.0.0.1:17687:7687"
    volumes:
      - metric-platform-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 10
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: metric_platform
      POSTGRES_USER: metric_platform
      POSTGRES_PASSWORD: metric_platform
    ports:
      - "5433:5432"
    volumes:
      - metric-platform-postgres:/var/lib/postgresql/data
volumes:
  metric-platform-neo4j:
  metric-platform-postgres:
