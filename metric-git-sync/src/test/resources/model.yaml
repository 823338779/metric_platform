version: "0.1.1"
semantic_model:
  - name: payment_analytics
    description: 支付交易分析
    custom_extensions:
      - vendor_name: COMMON
        data: '{"data_agent":{"profile":"ossie-metrics","profile_version":1}}'
    datasets:
      - name: payments
        source: fact_payment
        description: 支付交易明细
        ai_context:
          synonyms: [支付记录, 交易明细]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"data_agent":{"display_name":"支付交易","default_time_field":"paid_at"}}'
        fields:
          - name: amount
            description: 以元为单位的实付金额
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: paid_amount
            custom_extensions:
              - vendor_name: COMMON
                data: '{"data_agent":{"display_name":"实付金额","unit":"CNY"}}'
          - name: state
            description: 支付状态
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: payment_state
            dimension:
              is_time: false
          - name: paid_at
            description: 支付成功时间
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: payment_time
            dimension:
              is_time: true
          - name: region
            description: 支付交易所属地区编码
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: region_code
            dimension:
              is_time: false
      - name: regions
        source: dim_region
        description: 每个地区编码对应一条地区记录
        primary_key: [region_code]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"data_agent":{"display_name":"地区"}}'
        fields:
          - name: code
            description: 地区唯一编码
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: region_code
            dimension:
              is_time: false
          - name: region_name
            description: 地区显示名称
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: region_name
            dimension:
              is_time: false
            ai_context:
              synonyms: [地区名称, 区域名称]
    relationships:
      - name: payments_to_regions
        from: payments
        to: regions
        from_columns: [region_code]
        to_columns: [region_code]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"data_agent":{"join_type":"LEFT"}}'
    metrics:
      - name: paid_revenue
        description: 已支付交易的实付金额合计
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: "SUM(CASE WHEN payments.state = 'PAID' THEN payments.amount END)"
        ai_context:
          synonyms: [实收金额, 支付销售额]
        custom_extensions:
          - vendor_name: COMMON
            data: '{"data_agent":{"display_name":"支付收入","unit":"CNY"}}'
